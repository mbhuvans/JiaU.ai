const README = "# Federated Ontology Data Product Agent \u2014 Prototype v2\n\nA prototype of a **federated ontology architecture** over regional data products,\nwith an **ontology-driven AI agent** that answers business questions with full,\nmachine-readable explainability.\n\nThree regional source systems (AMER / EMEA / APAC) hold the same four business\ndomains \u2014 **clients, orders, trades, contracts** \u2014 in *deliberately incompatible*\nlocal schemas, code sets and currencies. A four-layer federated ontology stack,\nloaded at runtime from an **ontology repository folder**, unifies them into one\ncanonical semantic context that agents query.\n\n## Architecture\n\n```\n                        User question (\"fixed income exposure to\n                         professional clients in EMEA?\")\n                                      \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502            ONTOLOGY-DRIVEN AGENT (two modes)               \u2502\n        \u2502  planner.py \u2014 deterministic pipeline, no LLM key needed    \u2502\n        \u2502  agent.py   \u2014 LangGraph LLM agent with federation tools    \u2502\n        \u2502  intent \u2192 concepts \u2192 domains \u2192 navigate \u2192 sources \u2192        \u2502\n        \u2502  transformations \u2192 retrieval plan \u2192 execute \u2192 JSON answer  \u2502\n        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u2502 unified semantic context\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502        RUNTIME FEDERATION LAYER  (federation.py)           \u2502\n        \u2502  auto-discovers & integrates every *.ttl in ontology-repo/ \u2502\n        \u2514\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2518\n            \u2502               \u2502               \u2502                  \u2502\n   ontology-repo/global  ontology-repo/  ontology-repo/   ontology-repo/\n   global business       regional/       mappings/        rules/\n   ontology + SKOS       AMER/EMEA/APAC  physical column  global value/id/FX/\n   taxonomies            extensions      bindings         calculation rules\n            \u2502               \u2502               \u2502                  \u2502\n        \u250c\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502      FEDERATED RETRIEVAL ENGINE  (data_product.py)         \u2502\n        \u2502  load regional files \u2192 rename per mappings \u2192 decode codes  \u2502\n        \u2502  \u2192 normalise ids \u2192 convert FX \u2192 compute derived measures   \u2502\n        \u2502  \u2192 combine regions \u2192 filter/join/aggregate  (all logged)   \u2502\n        \u2514\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n            \u2502                    \u2502                   \u2502\n      data/amer/*.xlsx     data/emea/*.xlsx    data/apac/*.xlsx\n      canonical-style      *_ref ids, code     acct/ord numbers,\n      columns, USD         values, EUR, MiFID  letter codes, SGD\n```\n\n## The four federated ontology layers\n\n| Layer | Folder | Contents |\n|---|---|---|\n| **1. Global Business Ontology** | `ontology-repo/global/` | Canonical concepts (Client/Order/Trade/Contract), datatype properties with the canonical logical schema (`fs:dataset`/`fs:canonicalColumn`), global synonyms, measures (`fs:isMeasure`), join relationships (`fs:joinSpec`). Plus the SKOS taxonomies (instruments, segments, order lifecycle, risk, settlement). |\n| **2. Regional Ontology Extensions** | `ontology-repo/regional/` | Regional vocabulary layered onto global concepts \u2014 EMEA adds German terms (*kunde, auftrag, risikoklasse*) and the EMEA-only concept `mifidCategory`; APAC adds desk terms (*counter, lots, booking centre*); AMER adds US slang (*ticket, street, commish*). |\n| **3. Physical Data Mappings** | `ontology-repo/mappings/` | Per region, per dataset: which file and which local column realises each global concept (`fs:sourceColumn`), the column's currency, and which transformation rules apply (`fs:appliesRule`). |\n| **4. Global Transformation & Calculation Rules** | `ontology-repo/rules/` | Declarative rules: `fs:ValueMapRule` (INST\u2192Institutional, OPN\u2192Open, DE\u2192Germany\u2026), `fs:IdNormalisationRule` (EU-0101\u2192CL0101), `fs:FxConversionRule` (EUR/SGD\u2192USD), `fs:CalculationRule` (notional_usd = quantity \u00d7 limit_price; gross_amount_usd = executed_quantity \u00d7 execution_price). |\n\nEvery document carries `fs:layer` (and `fs:region`) annotations; the repository\nis **auto-discovered** \u2014 drop a new `.ttl` anywhere under `ontology-repo/` and it\nis loaded and classified at startup.\n\n## Components\n\n| Path | Purpose |\n|---|---|\n| `data/{amer,emea,apac}/*.xlsx` | Regional data sources with incompatible local schemas (36 clients, 210 orders, 199 trades, 60 contracts in total) |\n| `ontology-repo/**/*.ttl` | The federated ontology repository (9 documents, ~2,100 triples) |\n| `federation.py` | Runtime federation: discovery, layer classification, unified semantic context \u2014 `resolve()` (vocabulary with layer provenance), `expand_concept()` (SKOS), `navigate()` (concept \u2192 physical source lineage) |\n| `data_product.py` | `FederatedStore`: canonicalises each region per the mappings + rules (logged), combines regions, executes structured queries |\n| `planner.py` | `OntologyPlannerAgent`: deterministic 9-step pipeline from question to JSON answer + explainability trace \u2014 **no API key needed** |\n| `agent.py` | LangGraph LLM agent with 8 federation-aware tools (`search_ontology`, `expand_taxonomy_concept`, `navigate_to_source`, `query_data_product`, `plan_and_retrieve`, `validate_data_product`, `explore_entity`, `sparql_query`) |\n| `shacl_validate.py` + `shacl/` | SHACL data contracts validated against the **canonical** view \u2014 three regional schemas satisfying one global contract |\n| `knowledge_graph.py` | RDF knowledge graph: all ontology layers + canonical instances of all regions + materialized relationship and taxonomy-classification edges |\n| `webapp.py` | Flask demonstration UI |\n| `demo_offline.py` | End-to-end console demo, no key needed |\n| `generate_data.py` | Regenerates the synthetic regional data (seeded) |\n\n## Run\n\n```bash\npip install -r requirements.txt\n\n# console demo \u2014 full federated stack, no key needed\npython demo_offline.py\n\n# web UI  ->  http://localhost:5001\npython webapp.py\n\n# conversational LLM agent (terminal)\nexport ANTHROPIC_API_KEY=sk-ant-...        # or OPENAI_API_KEY + MODEL_PROVIDER=openai\npython agent.py\n```\n\n## Web UI (`webapp.py`)\n\n- **Ask (planner)** \u2014 type a business question; see the final data as a table\n  plus the numbered explainability trace: intent \u2192 concepts (with vocabulary\n  provenance: global vs regional extension) \u2192 taxonomy expansions \u2192 domains \u2192\n  ontology navigation to physical sources \u2192 sources selected \u2192 transformation\n  & calculation rules applied \u2192 retrieval plan (steps + query spec) \u2192 execution\n  log \u2192 full JSON output.\n- **Agent chat (LLM)** \u2014 configure provider/model/key in the browser (memory\n  only) and chat; every tool call is shown.\n- **Federation** \u2014 browse the discovered repository, the unified concept table\n  (global + regional synonyms side by side), all transformation rules, and the\n  taxonomy trees.\n- **Offline demo** \u2014 runs `demo_offline.py` end-to-end.\n- **README** \u2014 this document.\n\n## Agent output format\n\n`OntologyPlannerAgent.answer(question)` returns JSON:\n\n```json\n{\n  \"question\": \"...\",\n  \"answer_summary\": \"...\",\n  \"data\": { \"rows\": [...] | \"result\": 123.4 },\n  \"explainability\": {\n    \"1_intent\":                  { \"aggregation\": \"sum\", \"region_scope\": [\"EMEA\"], ... },\n    \"2_concepts_identified\":     [ {\"matched_name\": \"kunde\", \"vocabulary_layer\": \"regional-extension (EMEA)\", ...} ],\n    \"2b_taxonomy_expansions\":    [ {\"concept\": \"Bond\", \"hierarchy\": [...], \"filter_suggestion\": {...}} ],\n    \"3_domains_determined\":      { \"primary_dataset\": \"orders\", \"joined_dataset\": \"clients\", ... },\n    \"4_ontology_navigation\":     [ {\"concept\": \"clients.segment\", \"resolution\": [per-region source/column/rules]} ],\n    \"5_sources_selected\":        [ {\"region\": \"EMEA\", \"dataset\": \"orders\", \"file\": \"data/emea/orders.xlsx\"} ],\n    \"6_transformations_applied\": [ {\"rule\": \"FX conversion to USD\", \"column\": \"limit_price\", \"detail\": \"EUR -> USD @ 1.09\"} ],\n    \"7_retrieval_plan\":          { \"steps\": [...], \"query_spec\": {...} },\n    \"8_execution_log\":           [ {\"step\": \"load_source\", ...}, {\"step\": \"filter\", ...} ]\n  }\n}\n```\n\n## Example questions\n\n- \"Which customers are risky?\" (*risky* \u2192 risk taxonomy \u2192 `risk_rating = High`)\n- \"Total AUM of HNW investors\" (FX-normalised sum across USD/EUR/SGD books)\n- \"What is our fixed income exposure to professional clients in EMEA?\"\n  (two taxonomy expansions + join + derived `notional_usd` + region scope)\n- \"Notional by asset class for German clients\" (demonym \u2192 country filter, group-by)\n- \"How many active orders per region?\" (lifecycle taxonomy + regional grouping)\n- \"What is the MiFID category of German clients?\" (**regional-only concept** \u2014\n  resolvable only through the EMEA extension)\n- \"Total book size of accounts in APAC\" (regional synonyms *book size*, *account*)\n- LLM agent extras: \"Tell me everything about client CL0103\" (entity 360; note the\n  regional ref EU-0103 was normalised), \"Which clients with failed trades have\n  active contracts?\" (multi-hop SPARQL), \"Is the trades data trustworthy?\" (SHACL)\n\n## How federation answers a question (worked example)\n\n*\"What is our fixed income exposure to professional clients in EMEA?\"*\n\n1. **Intent** \u2014 aggregation implied by the measure; region scope EMEA.\n2. **Concepts** \u2014 *exposure* \u2192 `gb:notionalValue` (global synonym, a derived\n   measure); *fixed income* \u2192 SKOS Bond branch \u2192 `asset_class = Bond`;\n   *professional clients* \u2192 SKOS umbrella \u2192 `segment IN (Institutional, Corporate)`.\n3. **Domains** \u2014 measure lives in `orders`; segment lives in `clients` \u2192 join on\n   `client_id` (from `gb:placedBy`'s `fs:joinSpec`).\n4. **Navigation** \u2014 `orders.asset_class` in EMEA is `data/emea/orders.xlsx :\n   asset_category` with rule *Asset class decoding* (FI\u2192Bond); `clients.segment`\n   is `segment_code` with *Segment code decoding*; prices are EUR \u2192 *FX\n   conversion to USD*; `notional_usd` does not physically exist \u2192 *Order\n   notional (USD)* calculation rule.\n5. **Plan & execute** \u2014 canonicalise EMEA orders + clients, join, filter, sum.\n6. **Answer** \u2014 a USD figure plus the full trace above, as JSON.\n\n## Extending\n\n- **New region**: add `data/<region>/*.xlsx`, one mapping `.ttl` and (optionally)\n  one extension `.ttl` \u2014 no code changes; the repository is auto-discovered.\n- **New data product**: add the class/properties to the global ontology, per-region\n  mappings, a SHACL shape, and drop in the files.\n- **New rule**: declare it in `ontology-repo/rules/` and reference it from a\n  mapping via `fs:appliesRule`.\n- **Real FX**: replace the static rates in `rule:FxToUSD` with a rate feed.\n- **Databases instead of Excel**: reimplement `FederatedStore.canonical_frame()`\n  per source type; mappings could carry a `fs:sourceType` annotation.\n";
const FILES = [{"name": "federation.py", "lines": 534, "content": "\"\"\"Runtime federation layer.\n\nTreats `ontology-repo/` as an ONTOLOGY REPOSITORY: every *.ttl found under it\n(recursively) is discovered and loaded at runtime, classified by its declared\nfederated layer, and integrated into one unified semantic context:\n\n    global               \u2014 Global Business Ontology (canonical concepts/schema)\n    taxonomy             \u2014 SKOS vocabularies (hierarchy expansion)\n    regional-extension   \u2014 per-region vocabulary + region-only concepts\n    physical-mapping     \u2014 per-region bindings: concept -> file/column (+rules)\n    transformation-rules \u2014 global value/id/FX/calculation rules\n\nThe FederatedOntology object is the single semantic entry point used by the\nretrieval engine, the planner agent, the LLM agent, and the web UI.\n\"\"\"\nfrom __future__ import annotations\n\nimport glob\nimport os\nfrom dataclasses import dataclass, field\n\nimport rdflib\nfrom rdflib.namespace import OWL, RDF, RDFS, SKOS\n\nFS = rdflib.Namespace(\"http://example.org/finserv#\")\nGB = rdflib.Namespace(\"http://example.org/finserv/global#\")\n\nBASE = os.path.dirname(os.path.abspath(__file__))\nONTOLOGY_REPO = os.path.join(BASE, \"ontology-repo\")\nDATA_DIR = os.path.join(BASE, \"data\")\n\nREGIONS = [\"AMER\", \"EMEA\", \"APAC\"]\n\n\n# ------------------------------------------------------------------ dataclasses\n@dataclass\nclass Concept:\n    \"\"\"A business concept from the global ontology (possibly enriched or\n    contributed by a regional extension).\"\"\"\n    uri: str\n    kind: str                                  # class | datatype_property | object_property\n    label: str\n    synonyms: list[str] = field(default_factory=list)          # global names\n    regional_synonyms: dict[str, list[str]] = field(default_factory=dict)\n    comment: str = \"\"\n    dataset: str | None = None\n    canonical_column: str | None = None\n    is_measure: bool = False\n    is_identifier: bool = False\n    join_spec: str | None = None\n    regional_only: str | None = None           # region code if concept exists in one region\n\n    def all_names(self) -> list[tuple[str, str]]:\n        \"\"\"(name, provenance) pairs; provenance is 'global' or a region code.\"\"\"\n        names = [(self.label.lower(), \"global\")]\n        names += [(s.lower(), \"global\") for s in self.synonyms]\n        for region, syns in self.regional_synonyms.items():\n            names += [(s.lower(), region) for s in syns]\n        return names\n\n\n@dataclass\nclass ColumnBinding:\n    \"\"\"Physical binding of one global property in one region.\"\"\"\n    global_property: str\n    canonical_column: str\n    source_column: str\n    currency: str | None = None\n    rules: list[str] = field(default_factory=list)             # rule URIs\n\n\n@dataclass\nclass DatasetBinding:\n    region: str\n    dataset: str\n    source_file: str\n    source_folder: str\n    columns: list[ColumnBinding] = field(default_factory=list)\n\n    def path(self) -> str:\n        return os.path.join(BASE, self.source_folder, self.source_file)\n\n\n@dataclass\nclass Rule:\n    uri: str\n    label: str\n    rtype: str                                 # value_map | id_norm | fx | calc\n    comment: str = \"\"\n    value_map: dict[str, str] = field(default_factory=dict)\n    id_prefix: str = \"\"\n    id_width: int = 0\n    fx_rates: dict[str, float] = field(default_factory=dict)\n    dataset: str | None = None\n    target_column: str | None = None\n    expression: str | None = None\n\n    def describe(self) -> str:\n        if self.rtype == \"value_map\":\n            sample = \", \".join(f\"{k}->{v}\" for k, v in list(self.value_map.items())[:4])\n            return f\"{self.label}: {sample}{'...' if len(self.value_map) > 4 else ''}\"\n        if self.rtype == \"id_norm\":\n            return f\"{self.label}: rewrite to {self.id_prefix}{'#' * self.id_width}\"\n        if self.rtype == \"fx\":\n            return f\"{self.label}: \" + \", \".join(f\"{c}={r}\" for c, r in self.fx_rates.items())\n        return f\"{self.label}: {self.target_column} = {self.expression}\"\n\n\n@dataclass\nclass TaxonomyConcept:\n    uri: str\n    scheme: str\n    pref_label: str\n    alt_labels: list[str] = field(default_factory=list)\n    broader: str | None = None\n    scope_note: str = \"\"\n    dataset: str | None = None\n    column: str | None = None\n    value: str | None = None\n\n    def all_names(self) -> list[str]:\n        return [self.pref_label.lower()] + [a.lower() for a in self.alt_labels]\n\n\n@dataclass\nclass RepoFile:\n    path: str\n    layer: str\n    region: str | None\n    label: str\n    triples: int\n\n\n# ------------------------------------------------------------------ federation\nclass FederatedOntology:\n    \"\"\"Discovers, loads and integrates every ontology document in the\n    repository folder into one unified semantic context.\"\"\"\n\n    def __init__(self, repo_dir: str = ONTOLOGY_REPO):\n        self.repo_dir = repo_dir\n        self.graph = rdflib.Graph()            # merged graph (all layers)\n        self.files: list[RepoFile] = []\n        self.concepts: dict[str, Concept] = {}\n        self.bindings: dict[tuple[str, str], DatasetBinding] = {}   # (region, dataset)\n        self.rules: dict[str, Rule] = {}\n        self.tax_concepts: dict[str, TaxonomyConcept] = {}\n        self._file_graphs: list[tuple[RepoFile, rdflib.Graph]] = []\n        self._discover()\n        self._index_concepts()\n        self._index_regional_extensions()\n        self._index_rules()\n        self._index_mappings()\n        self._index_taxonomy()\n\n    # ---------------- discovery ----------------\n    def _discover(self) -> None:\n        \"\"\"Auto-discover every *.ttl under the repository folder.\"\"\"\n        for path in sorted(glob.glob(os.path.join(self.repo_dir, \"**\", \"*.ttl\"),\n                                     recursive=True)):\n            g = rdflib.Graph()\n            g.parse(path, format=\"turtle\")\n            layer, region, label = \"unclassified\", None, os.path.basename(path)\n            for ont in g.subjects(RDF.type, OWL.Ontology):\n                layer = str(g.value(ont, FS.layer) or layer)\n                r = g.value(ont, FS.region)\n                region = str(r) if r else None\n                label = str(g.value(ont, RDFS.label) or label)\n            rf = RepoFile(path=os.path.relpath(path, BASE), layer=layer,\n                          region=region, label=label, triples=len(g))\n            self.files.append(rf)\n            self._file_graphs.append((rf, g))\n            self.graph += g\n\n    def _layer_graphs(self, layer: str):\n        return [(rf, g) for rf, g in self._file_graphs if rf.layer == layer]\n\n    # ---------------- global concepts ----------------\n    def _index_concepts(self) -> None:\n        g = self.graph\n        kinds = [(OWL.Class, \"class\"), (OWL.DatatypeProperty, \"datatype_property\"),\n                 (OWL.ObjectProperty, \"object_property\")]\n        for rdf_type, kind in kinds:\n            for s in g.subjects(RDF.type, rdf_type):\n                label = g.value(s, RDFS.label)\n                if label is None or str(s).startswith(str(FS)):\n                    continue\n                c = Concept(\n                    uri=str(s), kind=kind, label=str(label),\n                    comment=str(g.value(s, RDFS.comment) or \"\"),\n                    dataset=str(g.value(s, FS.dataset) or \"\") or None,\n                    canonical_column=str(g.value(s, FS.canonicalColumn) or \"\") or None,\n                    is_measure=str(g.value(s, FS.isMeasure) or \"\") == \"true\",\n                    is_identifier=str(g.value(s, FS.isIdentifier) or \"\") == \"true\",\n                    join_spec=str(g.value(s, FS.joinSpec) or \"\") or None,\n                    regional_only=str(g.value(s, FS.regionalOnly) or \"\") or None,\n                )\n                self.concepts[c.uri] = c\n\n    def _index_regional_extensions(self) -> None:\n        \"\"\"Attribute synonyms to global vs regional layers by the document\n        each skos:altLabel triple was declared in.\"\"\"\n        # global synonyms: altLabels declared in the global-layer documents\n        for rf, g in self._layer_graphs(\"global\"):\n            for s, o in g.subject_objects(SKOS.altLabel):\n                c = self.concepts.get(str(s))\n                if c:\n                    c.synonyms.append(str(o))\n        # regional synonyms: altLabels declared in regional-extension documents\n        for rf, g in self._layer_graphs(\"regional-extension\"):\n            region = rf.region or \"?\"\n            for s, o in g.subject_objects(SKOS.altLabel):\n                c = self.concepts.get(str(s))\n                if c:\n                    c.regional_synonyms.setdefault(region, []).append(str(o))\n\n    # ---------------- rules ----------------\n    def _index_rules(self) -> None:\n        g = self.graph\n        typed = [(FS.ValueMapRule, \"value_map\"), (FS.IdNormalisationRule, \"id_norm\"),\n                 (FS.FxConversionRule, \"fx\"), (FS.CalculationRule, \"calc\")]\n        for rdf_type, rtype in typed:\n            for s in g.subjects(RDF.type, rdf_type):\n                r = Rule(uri=str(s), rtype=rtype,\n                         label=str(g.value(s, RDFS.label) or str(s).split(\"#\")[-1]),\n                         comment=str(g.value(s, RDFS.comment) or \"\"))\n                if rtype == \"value_map\":\n                    for bn in g.objects(s, FS.mapsValue):\n                        r.value_map[str(g.value(bn, FS[\"from\"]))] = str(g.value(bn, FS.to))\n                elif rtype == \"id_norm\":\n                    r.id_prefix = str(g.value(s, FS.idPrefix) or \"\")\n                    r.id_width = int(g.value(s, FS.idWidth) or 0)\n                elif rtype == \"fx\":\n                    for bn in g.objects(s, FS.rate):\n                        r.fx_rates[str(g.value(bn, FS.currency))] = \\\n                            float(g.value(bn, FS.rateToUSD))\n                elif rtype == \"calc\":\n                    r.dataset = str(g.value(s, FS.dataset) or \"\") or None\n                    r.target_column = str(g.value(s, FS.targetColumn) or \"\") or None\n                    r.expression = str(g.value(s, FS.expression) or \"\") or None\n                self.rules[r.uri] = r\n\n    @property\n    def fx_rule(self) -> Rule | None:\n        return next((r for r in self.rules.values() if r.rtype == \"fx\"), None)\n\n    def calc_rules(self, dataset: str) -> list[Rule]:\n        return [r for r in self.rules.values()\n                if r.rtype == \"calc\" and r.dataset == dataset]\n\n    # ---------------- physical mappings ----------------\n    def _index_mappings(self) -> None:\n        for rf, g in self._layer_graphs(\"physical-mapping\"):\n            region = rf.region or \"?\"\n            folder = \"\"\n            for ont in g.subjects(RDF.type, OWL.Ontology):\n                folder = str(g.value(ont, FS.sourceFolder) or \"\")\n            ds_nodes = {}\n            for ds_node in g.subjects(RDF.type, FS.DatasetMapping):\n                ds = str(g.value(ds_node, FS.dataset))\n                b = DatasetBinding(region=region, dataset=ds,\n                                   source_file=str(g.value(ds_node, FS.sourceFile)),\n                                   source_folder=folder)\n                ds_nodes[ds_node] = b\n                self.bindings[(region, ds)] = b\n            for col_node in g.subjects(RDF.type, FS.ColumnMapping):\n                ds_node = g.value(col_node, FS.inDataset)\n                b = ds_nodes.get(ds_node)\n                if b is None:\n                    continue\n                prop = str(g.value(col_node, FS.globalProperty))\n                concept = self.concepts.get(prop)\n                b.columns.append(ColumnBinding(\n                    global_property=prop,\n                    canonical_column=(concept.canonical_column if concept else None)\n                                      or str(g.value(col_node, FS.sourceColumn)),\n                    source_column=str(g.value(col_node, FS.sourceColumn)),\n                    currency=str(g.value(col_node, FS.currency) or \"\") or None,\n                    rules=[str(r) for r in g.objects(col_node, FS.appliesRule)],\n                ))\n\n    # ---------------- taxonomy ----------------\n    def _index_taxonomy(self) -> None:\n        g = self.graph\n        for s in g.subjects(RDF.type, SKOS.Concept):\n            scheme = g.value(s, SKOS.inScheme)\n            pref = g.value(s, SKOS.prefLabel)\n            if pref is None:\n                continue\n            self.tax_concepts[str(s)] = TaxonomyConcept(\n                uri=str(s),\n                scheme=str(g.value(scheme, SKOS.prefLabel) or scheme or \"\"),\n                pref_label=str(pref),\n                alt_labels=[str(a) for a in g.objects(s, SKOS.altLabel)],\n                broader=str(g.value(s, SKOS.broader)) if g.value(s, SKOS.broader) else None,\n                scope_note=str(g.value(s, SKOS.scopeNote) or \"\"),\n                dataset=str(g.value(s, FS.mappedToDataset) or \"\") or None,\n                column=str(g.value(s, FS.mappedToColumn) or \"\") or None,\n                value=str(g.value(s, FS.mappedToValue) or \"\") or None,\n            )\n\n    # ================= public semantic API =================\n    def resolve(self, phrase: str, top_k: int = 8) -> list[dict]:\n        \"\"\"Match a natural-language phrase against global + regional vocabulary.\n        Each match records WHERE the vocabulary came from (layer provenance).\"\"\"\n        phrase_l = phrase.lower()\n        tokens = set(phrase_l.replace(\"?\", \" \").replace(\",\", \" \").split())\n        scored = []\n        for c in self.concepts.values():\n            best_score, best_name, best_prov = 0.0, None, None\n            for name, prov in c.all_names():\n                if not name:\n                    continue\n                if name == phrase_l:\n                    score = 3.0\n                elif name in phrase_l:\n                    score = 2.0 + min(len(name) / 40, 0.9)\n                else:\n                    overlap = tokens & set(name.split())\n                    score = len(overlap) / max(len(name.split()), 1) if overlap else 0\n                if score > best_score:\n                    best_score, best_name, best_prov = score, name, prov\n            if best_score > 0:\n                scored.append((best_score, best_name, best_prov, c))\n        scored.sort(key=lambda x: -x[0])\n        out = []\n        for score, name, prov, c in scored[:top_k]:\n            layer = (\"global\" if prov == \"global\" else f\"regional-extension ({prov})\")\n            if prov == \"global\" and c.regional_only:\n                # concept itself was contributed by a regional extension\n                layer = f\"regional-extension ({c.regional_only})\"\n            d = {\"kind\": c.kind, \"label\": c.label, \"uri\": c.uri.split(\"/\")[-1],\n                 \"matched_name\": name,\n                 \"vocabulary_layer\": layer,\n                 \"dataset\": c.dataset, \"canonical_column\": c.canonical_column,\n                 \"match_score\": round(score, 2)}\n            if c.is_measure:\n                d[\"is_measure\"] = True\n            if c.join_spec:\n                d[\"join_spec\"] = c.join_spec\n            if c.regional_only:\n                d[\"regional_only\"] = c.regional_only\n            if c.comment:\n                d[\"comment\"] = c.comment\n            out.append({k: v for k, v in d.items() if v})\n        return out\n\n    def concept_by_column(self, dataset: str, column: str) -> Concept | None:\n        for c in self.concepts.values():\n            if c.dataset == dataset and c.canonical_column == column:\n                return c\n        return None\n\n    def navigate(self, dataset: str, canonical_column: str,\n                 regions: list[str] | None = None) -> list[dict]:\n        \"\"\"ONTOLOGY NAVIGATION: walk one canonical concept down to its physical\n        source in each region (global -> mapping -> file/column -> rules).\"\"\"\n        steps = []\n        concept = self.concept_by_column(dataset, canonical_column)\n        for region in (regions or REGIONS):\n            b = self.bindings.get((region, dataset))\n            if not b:\n                continue\n            col = next((cb for cb in b.columns\n                        if cb.canonical_column == canonical_column), None)\n            if col is None:\n                if concept and concept.regional_only and concept.regional_only != region:\n                    steps.append({\"region\": region, \"resolution\": \"not available\",\n                                  \"reason\": f\"concept only captured in {concept.regional_only}\"})\n                continue\n            step = {\"region\": region,\n                    \"global_concept\": (concept.label if concept else canonical_column),\n                    \"source\": f\"{b.source_folder}/{b.source_file}\",\n                    \"source_column\": col.source_column,\n                    \"canonical_column\": col.canonical_column}\n            if col.currency and col.currency != \"USD\":\n                step[\"currency\"] = col.currency\n            if col.rules:\n                step[\"transformations\"] = [self.rules[r].label\n                                           for r in col.rules if r in self.rules]\n            steps.append(step)\n        return steps\n\n    # ---------------- taxonomy operations (SKOS) ----------------\n    def _narrower(self, uri: str) -> list[TaxonomyConcept]:\n        return [c for c in self.tax_concepts.values() if c.broader == uri]\n\n    def expand_concept(self, phrase: str) -> dict | None:\n        \"\"\"Expand a broad business concept through the SKOS hierarchies into\n        concrete canonical filter values.\"\"\"\n        phrase_l = phrase.lower().strip()\n        best, best_score, best_name = None, 0.0, None\n        for c in self.tax_concepts.values():\n            for name in c.all_names():\n                if name == phrase_l:\n                    score = 3.0\n                elif name in phrase_l or phrase_l in name:\n                    score = 2.0 + min(len(name) / 40, 0.9)\n                else:\n                    overlap = set(phrase_l.split()) & set(name.split())\n                    score = len(overlap) / max(len(name.split()), 1) if overlap else 0\n                if score > best_score:\n                    best, best_score, best_name = c, score, name\n        if not best or best_score < 1.0:\n            return None\n        groups: dict[tuple[str, str], dict] = {}\n        hierarchy = []\n        stack = [(best, 0)]\n        while stack:\n            c, depth = stack.pop()\n            hierarchy.append((\"  \" * depth) + c.pref_label)\n            if c.value and c.dataset and c.column:\n                gset = groups.setdefault((c.dataset, c.column),\n                                         {\"values\": set(), \"min_depth\": depth})\n                gset[\"values\"].add(c.value)\n                gset[\"min_depth\"] = min(gset[\"min_depth\"], depth)\n            for child in self._narrower(c.uri):\n                stack.append((child, depth + 1))\n        result = {\"concept\": best.pref_label, \"scheme\": best.scheme,\n                  \"matched_name\": best_name,\n                  \"match_score\": round(best_score, 2), \"hierarchy\": hierarchy}\n        if best.scope_note:\n            result[\"note\"] = best.scope_note\n        if groups:\n            if best.column and (best.dataset, best.column) in groups:\n                dataset, column = best.dataset, best.column\n            else:\n                dataset, column = min(groups, key=lambda k: groups[k][\"min_depth\"])\n            values = sorted(groups[(dataset, column)][\"values\"])\n            result.update({\"dataset\": dataset, \"column\": column, \"values\": values})\n            result[\"filter_suggestion\"] = {\n                \"column\": column,\n                \"op\": \"in\" if len(values) > 1 else \"eq\",\n                \"value\": values if len(values) > 1 else values[0]}\n            others = {f\"{ds}.{col}\": sorted(gg[\"values\"])\n                      for (ds, col), gg in groups.items() if (ds, col) != (dataset, column)}\n            if others:\n                result[\"alternative_mappings\"] = others\n        return result\n\n    def taxonomy_tree(self) -> str:\n        lines = []\n        roots = [c for c in self.tax_concepts.values() if not c.broader]\n        for root in sorted(roots, key=lambda c: c.scheme):\n            lines.append(f\"\\n[{root.scheme}]\")\n            stack = [(root, 0)]\n            while stack:\n                c, depth = stack.pop()\n                tag = f\" -> {c.dataset}.{c.column}='{c.value}'\" if c.value else \"\"\n                lines.append(\"  \" * depth + f\"- {c.pref_label}{tag}\")\n                for child in sorted(self._narrower(c.uri),\n                                    key=lambda x: x.pref_label, reverse=True):\n                    stack.append((child, depth + 1))\n        return \"\\n\".join(lines)\n\n    # ---------------- summaries (UI / LLM context) ----------------\n    def repository_inventory(self) -> list[dict]:\n        return [{\"file\": f.path, \"layer\": f.layer, \"region\": f.region,\n                 \"label\": f.label, \"triples\": f.triples} for f in self.files]\n\n    def datasets(self) -> list[str]:\n        return sorted({ds for (_, ds) in self.bindings})\n\n    def regions_for(self, dataset: str) -> list[str]:\n        return [r for r in REGIONS if (r, dataset) in self.bindings]\n\n    def join_specs(self) -> dict[tuple[str, str], str]:\n        out = {}\n        for c in self.concepts.values():\n            if c.join_spec:\n                left, right = [s.strip() for s in c.join_spec.split(\"=\")]\n                ds1, col1 = left.split(\".\")\n                ds2, col2 = right.split(\".\")\n                out[(ds1, ds2)] = col1\n                out[(ds2, ds1)] = col2\n        return out\n\n    def measures(self, dataset: str | None = None) -> list[Concept]:\n        return [c for c in self.concepts.values()\n                if c.is_measure and (dataset is None or c.dataset == dataset)]\n\n    def schema_summary(self) -> str:\n        \"\"\"Canonical schema + per-region physical bindings \u2014 context for the LLM.\"\"\"\n        lines = [\"CANONICAL (GLOBAL) SCHEMA with per-region physical sources:\"]\n        for ds in self.datasets():\n            cls = next((c for c in self.concepts.values()\n                        if c.kind == \"class\" and c.dataset == ds), None)\n            lines.append(f\"\\n## Data product '{ds}'\"\n                         + (f\" ({cls.label})\" if cls else \"\"))\n            cols = [c for c in self.concepts.values()\n                    if c.kind == \"datatype_property\" and c.dataset == ds\n                    and c.canonical_column]\n            for c in cols:\n                syn = \", \".join(c.synonyms[:3])\n                regional = \"; \".join(\n                    f\"{r}: {', '.join(s[:2] for s in [syns])[0:60]}\"\n                    for r, syns in\n                    [(r, \", \".join(ss[:2])) for r, ss in c.regional_synonyms.items()])\n                extra = f\" [measure]\" if c.is_measure else \"\"\n                only = f\" [ONLY in {c.regional_only}]\" if c.regional_only else \"\"\n                lines.append(f\"- {c.canonical_column}: {c.label}{extra}{only}\"\n                             + (f\" (aka {syn})\" if syn else \"\")\n                             + (f\" (regional: {regional})\" if regional else \"\"))\n            srcs = []\n            for r in self.regions_for(ds):\n                b = self.bindings[(r, ds)]\n                srcs.append(f\"{r}={b.source_folder}/{b.source_file}\")\n            lines.append(f\"  sources: {'; '.join(srcs)}\")\n        lines.append(\"\\nJOIN RELATIONSHIPS:\")\n        for c in self.concepts.values():\n            if c.join_spec:\n                lines.append(f\"- {c.label}: {c.join_spec}\")\n        return \"\\n\".join(lines)\n\n\nif __name__ == \"__main__\":\n    fed = FederatedOntology()\n    print(f\"Repository: {len(fed.files)} documents, {len(fed.graph)} triples\")\n    for f in fed.files:\n        print(f\"  [{f.layer:<20}] {f.region or '-':<5} {f.path} ({f.triples})\")\n    print(f\"\\nConcepts: {len(fed.concepts)} | rules: {len(fed.rules)} | \"\n          f\"taxonomy concepts: {len(fed.tax_concepts)} | \"\n          f\"bindings: {len(fed.bindings)}\")\n    print(\"\\n--- resolve('risky kunden') ---\")\n    for m in fed.resolve(\"risky kunden\", top_k=3):\n        print(\" \", m)\n    print(\"\\n--- resolve('mifid category') ---\")\n    for m in fed.resolve(\"mifid category\", top_k=2):\n        print(\" \", m)\n    print(\"\\n--- navigate clients.segment ---\")\n    for s in fed.navigate(\"clients\", \"segment\"):\n        print(\" \", s)\n    print(\"\\n--- expand 'fixed income' ---\")\n    print(fed.expand_concept(\"fixed income\"))\n"}, {"name": "data_product.py", "lines": 254, "content": "\"\"\"Federated data product access layer.\n\nLoads the REGIONAL Excel sources declared in the physical-mapping layer,\napplies the global transformation & calculation rules to bring every region\nonto the canonical schema, and answers structured queries (filters, joins,\naggregation) over the combined canonical view.\n\nEvery canonicalisation step is RECORDED, so the agent can expose an\nexplainability trace of exactly which sources were read and which\ntransformations were applied.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\n\nimport pandas as pd\n\nfrom federation import BASE, FederatedOntology, REGIONS, Rule\n\nDATASETS = [\"clients\", \"orders\", \"trades\", \"contracts\"]\nJOIN_KEYS = {\n    (\"clients\", \"orders\"): \"client_id\",\n    (\"clients\", \"trades\"): \"client_id\",\n    (\"clients\", \"contracts\"): \"client_id\",\n    (\"orders\", \"trades\"): \"order_id\",\n}\nOPS = {\n    \"eq\": lambda s, v: s.astype(str).str.lower() == str(v).lower(),\n    \"ne\": lambda s, v: s.astype(str).str.lower() != str(v).lower(),\n    \"contains\": lambda s, v: s.astype(str).str.lower().str.contains(str(v).lower(), na=False),\n    \"gt\": lambda s, v: pd.to_numeric(s, errors=\"coerce\") > float(v),\n    \"gte\": lambda s, v: pd.to_numeric(s, errors=\"coerce\") >= float(v),\n    \"lt\": lambda s, v: pd.to_numeric(s, errors=\"coerce\") < float(v),\n    \"lte\": lambda s, v: pd.to_numeric(s, errors=\"coerce\") <= float(v),\n    \"in\": lambda s, v: s.astype(str).str.lower().isin([str(x).lower() for x in v]),\n    \"date_gte\": lambda s, v: pd.to_datetime(s, errors=\"coerce\") >= pd.to_datetime(v),\n    \"date_lte\": lambda s, v: pd.to_datetime(s, errors=\"coerce\") <= pd.to_datetime(v),\n}\n\n_DIGITS = re.compile(r\"(\\d+)\")\n\n\nclass FederatedStore:\n    \"\"\"Retrieval engine over the federated regional sources.\"\"\"\n\n    def __init__(self, federation: FederatedOntology | None = None):\n        self.fed = federation or FederatedOntology()\n        self._canonical: dict[tuple[str, str], pd.DataFrame] = {}\n        self._transform_log: dict[tuple[str, str], list[dict]] = {}\n\n    # ----------------------------------------------------------- canonicalise\n    def _apply_rule(self, series: pd.Series, rule: Rule) -> pd.Series:\n        if rule.rtype == \"value_map\":\n            return series.map(lambda v: rule.value_map.get(str(v).strip(), v))\n        if rule.rtype == \"id_norm\":\n            def norm(v):\n                m = _DIGITS.search(str(v))\n                return f\"{rule.id_prefix}{int(m.group(1)):0{rule.id_width}d}\" if m else v\n            return series.map(norm)\n        return series\n\n    def canonical_frame(self, dataset: str, region: str) -> pd.DataFrame:\n        \"\"\"Load ONE region's source file and canonicalise it:\n        rename columns, decode values, normalise ids, convert FX, add derived\n        measures \u2014 all driven by the ontology repository, all logged.\"\"\"\n        key = (region, dataset)\n        if key in self._canonical:\n            return self._canonical[key].copy()\n        binding = self.fed.bindings.get(key)\n        if binding is None:\n            raise ValueError(f\"No physical mapping for {dataset} in {region}\")\n        log: list[dict] = []\n        raw = pd.read_excel(binding.path())\n        log.append({\"step\": \"load_source\", \"region\": region,\n                    \"file\": f\"{binding.source_folder}/{binding.source_file}\",\n                    \"rows\": len(raw), \"source_columns\": list(raw.columns)})\n\n        df = pd.DataFrame()\n        renames, decodes, fx_applied = [], [], []\n        fx = self.fed.fx_rule\n        for cb in binding.columns:\n            if cb.source_column not in raw.columns:\n                continue\n            series = raw[cb.source_column]\n            if cb.source_column != cb.canonical_column:\n                renames.append(f\"{cb.source_column} -> {cb.canonical_column}\")\n            for rule_uri in cb.rules:\n                rule = self.fed.rules.get(rule_uri)\n                if rule is None:\n                    continue\n                series = self._apply_rule(series, rule)\n                decodes.append({\"column\": cb.canonical_column, \"rule\": rule.label,\n                                \"type\": rule.rtype})\n            if cb.currency and cb.currency != \"USD\" and fx is not None:\n                rate = fx.fx_rates.get(cb.currency)\n                if rate:\n                    series = pd.to_numeric(series, errors=\"coerce\").mul(rate).round(2)\n                    fx_applied.append({\"column\": cb.canonical_column,\n                                       \"from_currency\": cb.currency, \"rate_to_usd\": rate,\n                                       \"rule\": fx.label})\n            df[cb.canonical_column] = series\n        if renames:\n            log.append({\"step\": \"apply_physical_mapping\", \"region\": region,\n                        \"renamed_columns\": renames})\n        if decodes:\n            log.append({\"step\": \"apply_value_and_id_rules\", \"region\": region,\n                        \"transformations\": decodes})\n        if fx_applied:\n            log.append({\"step\": \"apply_fx_conversion\", \"region\": region,\n                        \"conversions\": fx_applied})\n\n        # global calculation rules (derived canonical measures)\n        for rule in self.fed.calc_rules(dataset):\n            try:\n                df[rule.target_column] = pd.eval(rule.expression,\n                                                 local_dict={c: df[c] for c in df.columns},\n                                                 engine=\"python\")\n                df[rule.target_column] = pd.to_numeric(\n                    df[rule.target_column], errors=\"coerce\").round(2)\n                log.append({\"step\": \"apply_calculation_rule\", \"region\": region,\n                            \"rule\": rule.label, \"derived_column\": rule.target_column,\n                            \"expression\": rule.expression})\n            except Exception as e:\n                log.append({\"step\": \"calculation_rule_failed\", \"rule\": rule.label,\n                            \"error\": str(e)})\n\n        df[\"region\"] = region\n        self._canonical[key] = df\n        self._transform_log[key] = log\n        return df.copy()\n\n    def combined_frame(self, dataset: str, regions: list[str] | None = None\n                       ) -> tuple[pd.DataFrame, list[dict]]:\n        \"\"\"Union the canonical frames of the requested regions.\"\"\"\n        regions = regions or self.fed.regions_for(dataset)\n        frames, log = [], []\n        for r in regions:\n            if (r, dataset) not in self.fed.bindings:\n                continue\n            frames.append(self.canonical_frame(dataset, r))\n            log.extend(self._transform_log[(r, dataset)])\n        if not frames:\n            raise ValueError(f\"No sources available for {dataset} in {regions}\")\n        combined = pd.concat(frames, ignore_index=True)\n        log.append({\"step\": \"combine_regions\", \"dataset\": dataset,\n                    \"regions\": regions, \"rows\": len(combined)})\n        return combined, log\n\n    # ----------------------------------------------------------- query\n    def query(self, spec: dict) -> dict:\n        \"\"\"Execute a structured query spec over the federated canonical view:\n        {\n          \"dataset\": \"orders\",\n          \"regions\": [\"EMEA\", \"APAC\"],               # optional; default all\n          \"join\": {\"dataset\": \"clients\"},            # optional\n          \"filters\": [{\"column\",\"op\",\"value\"}],\n          \"columns\": [...], \"sort_by\": \"...\", \"descending\": true, \"limit\": 20,\n          \"aggregate\": {\"op\": \"sum|mean|count|max|min\", \"column\": \"...\",\n                        \"group_by\": [\"...\"]}\n        }\n        Returns rows/aggregate plus the full canonicalisation + execution log.\n        \"\"\"\n        dataset = spec[\"dataset\"]\n        regions = spec.get(\"regions\") or None\n        df, log = self.combined_frame(dataset, regions)\n\n        join = spec.get(\"join\")\n        if join:\n            other = join[\"dataset\"]\n            key = JOIN_KEYS.get((dataset, other)) or JOIN_KEYS.get((other, dataset))\n            if not key:\n                raise ValueError(f\"No join path between {dataset} and {other}\")\n            other_df, other_log = self.combined_frame(other, regions)\n            log.extend(other_log)\n            df = df.merge(other_df, on=key, how=\"inner\",\n                          suffixes=(\"\", f\"_{other[:-1]}\"))\n            log.append({\"step\": \"join\", \"left\": dataset, \"right\": other,\n                        \"on\": key, \"rows_after_join\": len(df)})\n\n        for f in spec.get(\"filters\", []):\n            col, op, val = f[\"column\"], f.get(\"op\", \"eq\"), f.get(\"value\")\n            if col not in df.columns:\n                raise ValueError(f\"Column '{col}' not found. Available: {list(df.columns)}\")\n            if op not in OPS:\n                raise ValueError(f\"Unknown op '{op}'. Allowed: {list(OPS)}\")\n            before = len(df)\n            df = df[OPS[op](df[col], val)]\n            log.append({\"step\": \"filter\", \"column\": col, \"op\": op, \"value\": val,\n                        \"rows_before\": before, \"rows_after\": len(df)})\n\n        agg = spec.get(\"aggregate\")\n        if agg:\n            op, col = agg[\"op\"], agg.get(\"column\")\n            group_by = agg.get(\"group_by\") or []\n            if group_by:\n                gb = df.groupby(group_by)\n                out = gb.size().reset_index(name=\"count\") if op == \"count\" \\\n                    else getattr(gb[col], op)().reset_index()\n                if op != \"count\" and col:\n                    out[col] = pd.to_numeric(out[col], errors=\"coerce\").round(2)\n                df = out\n                log.append({\"step\": \"aggregate\", \"op\": op, \"column\": col,\n                            \"group_by\": group_by, \"groups\": len(df)})\n            else:\n                val = len(df) if op == \"count\" else \\\n                    getattr(pd.to_numeric(df[col], errors=\"coerce\"), op)()\n                log.append({\"step\": \"aggregate\", \"op\": op, \"column\": col,\n                            \"result\": round(float(val), 4)})\n                return {\"result\": round(float(val), 4), \"execution_log\": log,\n                        \"spec\": spec}\n\n        if spec.get(\"columns\"):\n            keep = [c for c in spec[\"columns\"] if c in df.columns]\n            if keep:\n                if \"region\" in df.columns and \"region\" not in keep:\n                    keep.append(\"region\")\n                df = df[keep]\n        if spec.get(\"sort_by\") and spec[\"sort_by\"] in df.columns:\n            df = df.sort_values(spec[\"sort_by\"], ascending=not spec.get(\"descending\", False))\n        total = len(df)\n        df = df.head(int(spec.get(\"limit\", 20)))\n        records = json.loads(df.to_json(orient=\"records\", date_format=\"iso\"))\n        return {\"total_matching_rows\": total, \"returned_rows\": len(records),\n                \"rows\": records, \"execution_log\": log}\n\n\nif __name__ == \"__main__\":\n    store = FederatedStore()\n    print(\"--- canonical clients (all regions) ---\")\n    df, log = store.combined_frame(\"clients\")\n    print(df[[\"client_id\", \"client_name\", \"segment\", \"country\",\n              \"risk_rating\", \"aum_usd_mm\", \"region\"]].head(8).to_string())\n    print(f\"\\n{len(df)} clients across regions:\",\n          df.groupby(\"region\").size().to_dict())\n    print(\"\\n--- transformation log (EMEA clients) ---\")\n    for entry in store._transform_log[(\"EMEA\", \"clients\")]:\n        print(\" \", json.dumps(entry)[:160])\n    print(\"\\n--- query: risky clients, aggregated AUM by region ---\")\n    res = store.query({\"dataset\": \"clients\",\n                       \"filters\": [{\"column\": \"risk_rating\", \"op\": \"eq\", \"value\": \"High\"}],\n                       \"aggregate\": {\"op\": \"sum\", \"column\": \"aum_usd_mm\",\n                                     \"group_by\": [\"region\"]}})\n    print(json.dumps({k: v for k, v in res.items() if k != \"execution_log\"},\n                     indent=1, default=str))\n    print(\"\\n--- query: notional by asset class (derived measure, join to clients) ---\")\n    res = store.query({\"dataset\": \"orders\", \"join\": {\"dataset\": \"clients\"},\n                       \"filters\": [{\"column\": \"country\", \"op\": \"eq\", \"value\": \"Germany\"}],\n                       \"aggregate\": {\"op\": \"sum\", \"column\": \"notional_usd\",\n                                     \"group_by\": [\"asset_class\"]}})\n    print(json.dumps({k: v for k, v in res.items() if k != \"execution_log\"},\n                     indent=1, default=str))\n"}, {"name": "planner.py", "lines": 460, "content": "\"\"\"Ontology-driven planner agent (deterministic \u2014 runs without any LLM).\n\nImplements the full agent pipeline of the prototype design objectives:\n\n  1. understand the business question and intent\n  2. identify relevant business concepts and relationships\n  3. determine the required domains and data\n  4. navigate global and regional ontology definitions\n  5. resolve concepts to physical data sources\n  6. identify required transformation / calculation rules\n  7. dynamically create a retrieval plan\n  8. retrieve and combine data across sources (regions + datasets)\n  9. generate the final business response\n\nOutput is a single JSON document containing the retrieved data AND a\nstructured explainability trace of every step above.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\n\nfrom data_product import FederatedStore, JOIN_KEYS\nfrom federation import FederatedOntology, REGIONS\n\nSTOPWORDS = {\n    \"the\", \"a\", \"an\", \"of\", \"in\", \"on\", \"for\", \"to\", \"and\", \"or\", \"our\", \"my\",\n    \"is\", \"are\", \"was\", \"were\", \"what\", \"whats\", \"which\", \"who\", \"show\", \"me\",\n    \"list\", \"give\", \"tell\", \"with\", \"that\", \"have\", \"has\", \"do\", \"does\", \"we\",\n    \"all\", \"any\", \"please\", \"their\", \"there\", \"how\", \"many\", \"much\", \"s\",\n    # aggregation keywords are intent, not vocabulary \u2014 never concept-matched\n    \"total\", \"sum\", \"overall\", \"aggregate\", \"combined\", \"average\", \"avg\",\n    \"mean\", \"count\", \"number\", \"top\", \"max\", \"maximum\", \"min\", \"minimum\",\n    \"highest\", \"lowest\", \"largest\", \"smallest\", \"biggest\",\n}\n\nREGION_WORDS = {\n    \"amer\": \"AMER\", \"americas\": \"AMER\", \"north america\": \"AMER\", \"latam\": \"AMER\",\n    \"emea\": \"EMEA\", \"europe\": \"EMEA\", \"european\": \"EMEA\",\n    \"apac\": \"APAC\", \"asia\": \"APAC\", \"asian\": \"APAC\", \"asia-pacific\": \"APAC\",\n    \"asia pacific\": \"APAC\",\n}\n\nDEMONYMS = {\n    \"german\": \"Germany\", \"swiss\": \"Switzerland\", \"french\": \"France\",\n    \"italian\": \"Italy\", \"dutch\": \"Netherlands\", \"british\": \"UK\", \"uk\": \"UK\",\n    \"japanese\": \"Japan\", \"singaporean\": \"Singapore\", \"australian\": \"Australia\",\n    \"indian\": \"India\", \"canadian\": \"Canada\", \"brazilian\": \"Brazil\",\n    \"mexican\": \"Mexico\", \"us\": \"USA\", \"usa\": \"USA\",\n}\n\nAGG_WORDS = [\n    (re.compile(r\"\\b(total|sum|overall|aggregate|combined)\\b\"), \"sum\"),\n    (re.compile(r\"\\b(average|avg|mean)\\b\"), \"mean\"),\n    (re.compile(r\"\\b(how many|count|number of)\\b\"), \"count\"),\n    (re.compile(r\"\\b(largest|highest|biggest|top|max|maximum)\\b\"), \"max\"),\n    (re.compile(r\"\\b(smallest|lowest|min|minimum)\\b\"), \"min\"),\n]\n\nDEFAULT_COLUMNS = {\n    \"clients\": [\"client_id\", \"client_name\", \"segment\", \"country\", \"risk_rating\",\n                \"kyc_status\", \"aum_usd_mm\"],\n    \"orders\": [\"order_id\", \"client_id\", \"instrument_symbol\", \"asset_class\",\n               \"side\", \"quantity\", \"limit_price\", \"order_status\", \"notional_usd\"],\n    \"trades\": [\"trade_id\", \"order_id\", \"client_id\", \"instrument_symbol\",\n               \"executed_quantity\", \"execution_price\", \"settlement_status\",\n               \"gross_amount_usd\"],\n    \"contracts\": [\"contract_id\", \"client_id\", \"contract_type\", \"contract_status\",\n                  \"governing_law\", \"expiry_date\", \"auto_renewal\"],\n}\n\n\nclass OntologyPlannerAgent:\n    \"\"\"Deterministic ontology-driven query planner + executor.\"\"\"\n\n    def __init__(self, federation: FederatedOntology | None = None,\n                 store: FederatedStore | None = None):\n        self.fed = federation or FederatedOntology()\n        self.store = store or FederatedStore(self.fed)\n        self._value_index = self._build_value_index()\n\n    # ---------------------------------------------------------- value index\n    def _build_value_index(self) -> dict[str, list[tuple[str, str, str]]]:\n        \"\"\"canonical value (lower) -> [(dataset, column, canonical value)].\n        Built from the canonical view of every dataset, for low-cardinality\n        text columns, so literal values in questions ('Germany', 'ISDA Master',\n        'XETRA') resolve to filters.\"\"\"\n        idx: dict[str, list[tuple[str, str, str]]] = {}\n        for ds in self.fed.datasets():\n            try:\n                df, _ = self.store.combined_frame(ds)\n            except Exception:\n                continue\n            for col in df.columns:\n                if col == \"region\" or df[col].dtype.kind not in \"OU\":\n                    continue\n                uniques = df[col].dropna().unique()\n                if len(uniques) > 40:\n                    continue\n                for v in uniques:\n                    v = str(v)\n                    if len(v) < 2 or \"@\" in v:\n                        continue\n                    idx.setdefault(v.lower(), []).append((ds, col, v))\n        return idx\n\n    # ---------------------------------------------------------- pipeline\n    def answer(self, question: str) -> dict:\n        trace: dict = {}\n        q = question.strip()\n        ql = \" \" + re.sub(r\"[?!.,;]\", \" \", q.lower()) + \" \"\n\n        # ---- step 1: intent -------------------------------------------------\n        agg_op = None\n        for pattern, op in AGG_WORDS:\n            if pattern.search(ql):\n                agg_op = op\n                break\n        regions = sorted({reg for w, reg in REGION_WORDS.items() if f\" {w} \" in ql\n                          or f\" {w}-\" in ql})\n        m = re.search(r\"\\b(?:by|per|breakdown by|split by)\\s+([a-z_ ]{3,30}?)(?:\\s+(?:for|of|in|across)\\b|\\s*$)\", ql.strip())\n        group_phrase = m.group(1).strip() if m else None\n        intent = {\"question\": q,\n                  \"aggregation\": agg_op,\n                  \"group_by_phrase\": group_phrase,\n                  \"region_scope\": regions or \"all regions\"}\n\n        # ---- step 2: identify concepts (global + regional vocabulary) -------\n        concepts, tax_expansions, filters, measure = [], [], {}, None\n        consumed: set[str] = set()\n\n        # demonym countries (\"german clients\" -> country = Germany)\n        for word, country in DEMONYMS.items():\n            if f\" {word} \" in ql:\n                filters.setdefault(\"clients\", []).append(\n                    {\"column\": \"country\", \"op\": \"eq\", \"value\": country})\n                concepts.append({\"label\": \"country\", \"matched_name\": word,\n                                 \"kind\": \"datatype_property\",\n                                 \"vocabulary_layer\": \"global\",\n                                 \"dataset\": \"clients\",\n                                 \"canonical_column\": \"country\",\n                                 \"resolved_value\": country})\n                consumed.add(word)\n\n        # n-gram scan against ontology + taxonomy vocabulary.\n        # All candidate matches are scored first, then assigned greedily by\n        # descending (score, length) so exact phrases win over loose overlaps.\n        tokens = [t for t in ql.split() if t not in STOPWORDS and t not in consumed]\n        candidates = []           # (score, n, i, kind, payload)\n        for n in (4, 3, 2, 1):\n            for i in range(len(tokens) - n + 1):\n                phrase = \" \".join(tokens[i:i + n])\n                if phrase in REGION_WORDS or phrase in DEMONYMS:\n                    continue\n                # taxonomy concept? (hierarchical expansion -> filter values)\n                exp = self.fed.expand_concept(phrase)\n                if (exp and exp.get(\"filter_suggestion\")\n                        and exp[\"match_score\"] >= 2.0\n                        and exp.get(\"matched_name\")\n                        and exp[\"matched_name\"] in phrase):   # name \u2286 phrase only\n                    candidates.append((exp[\"match_score\"], n, i, \"taxonomy\", exp))\n                # ontology concept? (class / property, global or regional)\n                matches = self.fed.resolve(phrase, top_k=1)\n                if (matches and matches[0][\"match_score\"] >= 2.0\n                        and matches[0].get(\"matched_name\", \"\") in phrase):\n                    candidates.append((matches[0][\"match_score\"], n, i,\n                                       \"concept\", matches[0]))\n                # literal canonical value? ('germany', 'isda master', 'xetra')\n                if n <= 3 and phrase in self._value_index:\n                    cands = self._value_index[phrase]\n                    cand = None\n                    if len(cands) == 1:\n                        cand = cands[0]\n                    else:   # disambiguate by column word present in the question\n                        for ds, col, v in cands:\n                            if col.split(\"_\")[0] in ql:\n                                cand = (ds, col, v)\n                                break\n                    if cand:\n                        candidates.append((3.0, n, i, \"value\",\n                                           {\"phrase\": phrase, \"match\": cand}))\n        used: set[int] = set()\n        for score, n, i, kind, payload in sorted(candidates,\n                                                 key=lambda c: (-c[0], -c[1])):\n            span = set(range(i, i + n))\n            if span & used:\n                continue\n            if kind == \"taxonomy\":\n                ds = payload[\"dataset\"]\n                f = dict(payload[\"filter_suggestion\"])\n                if f not in filters.get(ds, []):\n                    filters.setdefault(ds, []).append(f)\n                    tax_expansions.append(payload)\n                used |= span\n            elif kind == \"concept\":\n                if payload not in concepts:\n                    concepts.append(payload)\n                if payload.get(\"is_measure\") and measure is None:\n                    measure = payload\n                used |= span\n            else:\n                ds, col, v = payload[\"match\"]\n                f = {\"column\": col, \"op\": \"eq\", \"value\": v}\n                if f not in filters.get(ds, []):\n                    filters.setdefault(ds, []).append(f)\n                    concepts.append({\"label\": col, \"matched_name\": payload[\"phrase\"],\n                                     \"kind\": \"value\", \"dataset\": ds,\n                                     \"canonical_column\": col,\n                                     \"vocabulary_layer\": \"canonical value\",\n                                     \"resolved_value\": v})\n                used |= span\n\n        # ---- step 3: determine required domains (datasets) ------------------\n        class_hits = [c for c in concepts if c.get(\"kind\") == \"class\" and c.get(\"dataset\")]\n        if measure is not None:\n            primary = measure[\"dataset\"]\n        elif class_hits:\n            primary = class_hits[0][\"dataset\"]\n        elif filters:\n            primary = max(filters, key=lambda d: len(filters[d]))\n        else:\n            primary = \"clients\"\n        involved = set(filters) | {primary}\n        # group-by column resolution\n        group_by = []\n        if group_phrase:\n            if \"region\" in group_phrase:\n                group_by = [\"region\"]\n            else:\n                gm = self.fed.resolve(group_phrase, top_k=1)\n                if gm and gm[0][\"match_score\"] >= 1.0 and gm[0].get(\"canonical_column\"):\n                    group_by = [gm[0][\"canonical_column\"]]\n                    involved.add(gm[0][\"dataset\"])\n                    if gm[0] not in concepts:\n                        concepts.append(gm[0])\n        # a resolved measure with no explicit aggregation word implies a sum\n        # (\"our fixed income exposure\", \"notional by asset class\")\n        if measure is not None and agg_op is None:\n            agg_op = \"sum\"\n        # count intent with no measure -> count; sum/mean need a measure column\n        if agg_op in (\"sum\", \"mean\", \"max\", \"min\") and measure is None:\n            defaults = self.fed.measures(primary)\n            measure_col = defaults[0].canonical_column if defaults else None\n        else:\n            measure_col = measure[\"canonical_column\"] if measure else None\n\n        join = None\n        secondary = [d for d in involved if d != primary]\n        if secondary:\n            other = secondary[0]\n            if JOIN_KEYS.get((primary, other)) or JOIN_KEYS.get((other, primary)):\n                join = other\n            elif \"clients\" not in (primary, other):\n                join = \"clients\"     # hub dataset\n        domains = {\"primary_dataset\": primary,\n                   \"joined_dataset\": join,\n                   \"all_involved\": sorted(involved)}\n\n        # ---- step 4+5: navigate ontology -> physical sources ----------------\n        region_list = regions or None\n        columns_of_interest = []\n        for ds, fls in filters.items():\n            for f in fls:\n                columns_of_interest.append((ds, f[\"column\"]))\n        if measure_col:\n            columns_of_interest.append((primary, measure_col))\n        for col in group_by:\n            if col != \"region\":\n                ds = next((d for d in involved\n                           if self.fed.concept_by_column(d, col)), primary)\n                columns_of_interest.append((ds, col))\n        navigation = []\n        seen = set()\n        for ds, col in columns_of_interest:\n            if (ds, col) in seen:\n                continue\n            seen.add((ds, col))\n            steps = self.fed.navigate(ds, col, region_list)\n            if steps:\n                navigation.append({\"concept\": f\"{ds}.{col}\", \"resolution\": steps})\n\n        sources = []\n        for ds in sorted(involved):\n            for r in (region_list or self.fed.regions_for(ds)):\n                b = self.fed.bindings.get((r, ds))\n                if b:\n                    sources.append({\"region\": r, \"dataset\": ds,\n                                    \"file\": f\"{b.source_folder}/{b.source_file}\"})\n\n        # ---- step 6+7: build the retrieval plan -----------------------------\n        spec: dict = {\"dataset\": primary}\n        if region_list:\n            spec[\"regions\"] = region_list\n        if join:\n            spec[\"join\"] = {\"dataset\": join}\n        all_filters = []\n        for ds, fls in filters.items():\n            if ds == primary or ds == join or join is not None:\n                all_filters.extend(fls)\n        if all_filters:\n            spec[\"filters\"] = all_filters\n        if agg_op == \"count\" and not group_by:\n            spec[\"aggregate\"] = {\"op\": \"count\"}\n        elif agg_op and (measure_col or agg_op == \"count\"):\n            spec[\"aggregate\"] = {\"op\": agg_op}\n            if measure_col and agg_op != \"count\":\n                spec[\"aggregate\"][\"column\"] = measure_col\n            if group_by:\n                spec[\"aggregate\"][\"group_by\"] = group_by\n        elif group_by and measure_col:\n            spec[\"aggregate\"] = {\"op\": \"sum\", \"column\": measure_col,\n                                 \"group_by\": group_by}\n        else:\n            cols = list(DEFAULT_COLUMNS.get(primary, []))\n            if join:\n                cols += [c for c in DEFAULT_COLUMNS.get(join, [])[:4]\n                         if c not in cols]\n            for f in all_filters:\n                if f[\"column\"] not in cols:\n                    cols.append(f[\"column\"])\n            # include regional-only columns the user asked about (e.g. mifid)\n            for c in concepts:\n                cc = c.get(\"canonical_column\")\n                if cc and cc not in cols and c.get(\"dataset\") in involved:\n                    cols.append(cc)\n            spec[\"columns\"] = cols\n            spec[\"limit\"] = 20\n            if measure_col:\n                spec[\"sort_by\"], spec[\"descending\"] = measure_col, True\n\n        plan_steps = [f\"1. Read {len(sources)} regional source file(s): \"\n                      + \", \".join(s['file'] for s in sources)]\n        plan_steps.append(\"2. Canonicalise each region: rename columns per the \"\n                          \"physical mappings, apply value/id decoding rules, \"\n                          \"convert non-USD amounts, compute derived measures\")\n        plan_steps.append(f\"3. Combine regions into the canonical '{primary}' view\"\n                          + (f\" and join to '{join}'\" if join else \"\"))\n        if all_filters:\n            plan_steps.append(\"4. Apply filters: \" + \"; \".join(\n                f\"{f['column']} {f.get('op', 'eq')} {f['value']}\" for f in all_filters))\n        if spec.get(\"aggregate\"):\n            a = spec[\"aggregate\"]\n            plan_steps.append(f\"5. Aggregate: {a['op']}\"\n                              + (f\" of {a.get('column')}\" if a.get(\"column\") else \"\")\n                              + (f\" grouped by {a['group_by']}\" if a.get(\"group_by\") else \"\"))\n        else:\n            plan_steps.append(f\"5. Project columns and return up to {spec.get('limit', 20)} rows\")\n\n        # ---- step 8: execute -------------------------------------------------\n        try:\n            result = self.store.query(spec)\n            error = None\n        except Exception as e:\n            result, error = {\"execution_log\": []}, str(e)\n\n        execution_log = result.pop(\"execution_log\", [])\n        transformations = self._summarise_transformations(execution_log)\n\n        # ---- step 9: business response --------------------------------------\n        answer_summary = self._summarise(q, spec, result, error, regions)\n\n        return {\n            \"question\": q,\n            \"answer_summary\": answer_summary,\n            \"data\": result if not error else {\"error\": error},\n            \"explainability\": {\n                \"1_intent\": intent,\n                \"2_concepts_identified\": concepts,\n                \"2b_taxonomy_expansions\": tax_expansions,\n                \"3_domains_determined\": domains,\n                \"4_ontology_navigation\": navigation,\n                \"5_sources_selected\": sources,\n                \"6_transformations_applied\": transformations,\n                \"7_retrieval_plan\": {\"steps\": plan_steps, \"query_spec\": spec},\n                \"8_execution_log\": execution_log,\n            },\n        }\n\n    # ---------------------------------------------------------- helpers\n    @staticmethod\n    def _summarise_transformations(execution_log: list[dict]) -> list[dict]:\n        out, seen = [], set()\n        for entry in execution_log:\n            step = entry.get(\"step\", \"\")\n            if step == \"apply_value_and_id_rules\":\n                for t in entry.get(\"transformations\", []):\n                    key = (entry[\"region\"], t[\"rule\"], t[\"column\"])\n                    if key not in seen:\n                        seen.add(key)\n                        out.append({\"region\": entry[\"region\"], \"rule\": t[\"rule\"],\n                                    \"type\": t[\"type\"], \"column\": t[\"column\"]})\n            elif step == \"apply_fx_conversion\":\n                for c in entry.get(\"conversions\", []):\n                    key = (entry[\"region\"], c[\"rule\"], c[\"column\"])\n                    if key not in seen:\n                        seen.add(key)\n                        out.append({\"region\": entry[\"region\"], \"rule\": c[\"rule\"],\n                                    \"type\": \"fx\", \"column\": c[\"column\"],\n                                    \"detail\": f\"{c['from_currency']} -> USD @ {c['rate_to_usd']}\"})\n            elif step == \"apply_calculation_rule\":\n                key = (entry[\"region\"], entry[\"rule\"])\n                if key not in seen:\n                    seen.add(key)\n                    out.append({\"region\": entry[\"region\"], \"rule\": entry[\"rule\"],\n                                \"type\": \"calculation\", \"column\": entry[\"derived_column\"],\n                                \"detail\": entry[\"expression\"]})\n        return out\n\n    @staticmethod\n    def _summarise(q, spec, result, error, regions) -> str:\n        scope = f\" in {'/'.join(regions)}\" if regions else \" across all regions\"\n        if error:\n            return f\"Could not answer{scope}: {error}\"\n        if \"result\" in result:\n            a = spec.get(\"aggregate\", {})\n            return (f\"{a.get('op', 'value').capitalize()} of \"\n                    f\"{a.get('column', 'rows')}{scope} = {result['result']:,}\")\n        rows = result.get(\"rows\", [])\n        if spec.get(\"aggregate\", {}).get(\"group_by\"):\n            gb = spec[\"aggregate\"][\"group_by\"]\n            col = spec[\"aggregate\"].get(\"column\", \"count\")\n            parts = []\n            for r in rows[:6]:\n                key = \"/\".join(str(r[g]) for g in gb if g in r)\n                val = r.get(col) or r.get(\"count\")\n                parts.append(f\"{key}: {val:,}\" if isinstance(val, (int, float))\n                             else f\"{key}: {val}\")\n            op = spec[\"aggregate\"][\"op\"]\n            what = \"count\" if op == \"count\" else f\"{op} of {col}\"\n            return f\"{what} by {', '.join(gb)}{scope} \u2014 \" + \"; \".join(parts)\n        total = result.get(\"total_matching_rows\", len(rows))\n        return (f\"{total} row(s) matched{scope}; returning {len(rows)}. \"\n                f\"Federated over datasets: {spec['dataset']}\"\n                + (f\" + {spec['join']['dataset']}\" if spec.get(\"join\") else \"\") + \".\")\n\n\nif __name__ == \"__main__\":\n    import json\n\n    agent = OntologyPlannerAgent()\n    for q in [\n        \"Which customers are risky?\",\n        \"Total AUM of HNW investors\",\n        \"What is our fixed income exposure to professional clients in EMEA?\",\n        \"Show fills that failed settlement\",\n        \"Notional by asset class for German clients\",\n        \"How many active orders per region?\",\n        \"What is the MiFID category of German clients?\",\n        \"Total book size of accounts in APAC\",\n    ]:\n        r = agent.answer(q)\n        print(\"=\" * 72)\n        print(\"Q:\", q)\n        print(\"A:\", r[\"answer_summary\"])\n        ex = r[\"explainability\"]\n        print(\"   concepts:\", [(c.get(\"matched_name\"), c.get(\"vocabulary_layer\"))\n                               for c in ex[\"2_concepts_identified\"]])\n        print(\"   taxonomy:\", [t[\"concept\"] for t in ex[\"2b_taxonomy_expansions\"]])\n        print(\"   domains :\", ex[\"3_domains_determined\"])\n        print(\"   spec    :\", json.dumps(ex[\"7_retrieval_plan\"][\"query_spec\"]))\n"}, {"name": "agent.py", "lines": 265, "content": "\"\"\"LangGraph + LangChain conversational agent over the FEDERATED semantic layer.\n\nGraph:  user question -> agent (LLM) <-> tools (federation, retrieval, planner,\n        validation, knowledge graph) -> answer\n\nThe LLM operates on the unified semantic context produced by the runtime\nfederation layer, so it understands global vocabulary, regional vocabulary\n(including German terms), and where every concept physically lives.\n\nSet ANTHROPIC_API_KEY (default) or OPENAI_API_KEY + MODEL_PROVIDER=openai.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nfrom typing import Annotated, TypedDict\n\nfrom langchain_core.messages import BaseMessage, SystemMessage\nfrom langchain_core.tools import tool\nfrom langgraph.graph import END, StateGraph\nfrom langgraph.graph.message import add_messages\nfrom langgraph.prebuilt import ToolNode\n\nfrom data_product import FederatedStore, JOIN_KEYS, OPS\nfrom federation import FederatedOntology, REGIONS\nfrom planner import OntologyPlannerAgent\n\n# ---------------------------------------------------------------- singletons\nFED = FederatedOntology()\nSTORE = FederatedStore(FED)\nPLANNER = OntologyPlannerAgent(FED, STORE)\n\n\n# ---------------------------------------------------------------- tools\n@tool\ndef search_ontology(phrase: str) -> str:\n    \"\"\"Resolve a business phrase against the FEDERATED vocabulary \u2014 global\n    ontology + all regional extensions (e.g. 'risky kunden', 'book size',\n    'mifid category', 'counter'). Returns matching concepts with the layer the\n    vocabulary came from (global vs regional-extension), the canonical dataset/\n    column, and join hints. ALWAYS call this first to ground the user's\n    vocabulary before querying data.\"\"\"\n    matches = FED.resolve(phrase)\n    if not matches:\n        return \"No ontology matches. Try individual keywords.\"\n    return json.dumps(matches, indent=1)\n\n\n@tool\ndef expand_taxonomy_concept(phrase: str) -> str:\n    \"\"\"Expand a broad business concept through the SKOS taxonomies into\n    concrete canonical filter values. Use when the user's term is a CATEGORY,\n    e.g. 'fixed income' -> asset_class=Bond, 'professional clients' ->\n    segment in [Institutional, Corporate], 'active orders' -> order_status in\n    [Open, Partially Filled], 'risky' -> risk_rating=High. Returns the\n    hierarchy and a ready-made filter_suggestion for query_data_product.\"\"\"\n    result = FED.expand_concept(phrase)\n    if result is None:\n        return \"No taxonomy concept matched. Taxonomy tree:\\n\" + FED.taxonomy_tree()\n    return json.dumps(result, indent=1)\n\n\n@tool\ndef navigate_to_source(dataset: str, canonical_column: str) -> str:\n    \"\"\"ONTOLOGY NAVIGATION: show how one canonical concept resolves to its\n    physical source in each region \u2014 source file, local column name, currency\n    and the transformation rules applied (value decoding, id normalisation,\n    FX conversion). Use to explain federation lineage, e.g.\n    navigate_to_source('clients', 'segment').\"\"\"\n    steps = FED.navigate(dataset, canonical_column)\n    if not steps:\n        return f\"No physical mapping found for {dataset}.{canonical_column}.\"\n    return json.dumps(steps, indent=1)\n\n\n@tool\ndef query_data_product(spec_json: str) -> str:\n    \"\"\"Run a structured query over the FEDERATED canonical view. The engine\n    reads the regional Excel sources, canonicalises them (mappings + global\n    transformation/calculation rules) and combines regions. Pass JSON:\n    {\n      \"dataset\": one of [\"clients\",\"orders\",\"trades\",\"contracts\"],\n      \"regions\": [\"AMER\",\"EMEA\",\"APAC\"] (optional; default all),\n      \"join\": {\"dataset\": \"<other>\"} (optional; clients-orders/trades/contracts\n               via client_id, orders-trades via order_id),\n      \"filters\": [{\"column\": \"...\", \"op\": \"eq|ne|contains|gt|gte|lt|lte|in|date_gte|date_lte\",\n                   \"value\": ...}],\n      \"columns\": [...], \"sort_by\": \"...\", \"descending\": true, \"limit\": 20,\n      \"aggregate\": {\"op\": \"sum|mean|count|max|min\", \"column\": \"...\",\n                    \"group_by\": [\"...\"]}\n    }\n    Use CANONICAL column names from search_ontology. Monetary values are USD\n    after FX normalisation.
