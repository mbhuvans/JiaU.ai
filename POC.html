Every row carries a 'region' column.\"\"\"\n    try:\n        spec = json.loads(spec_json)\n        result = STORE.query(spec)\n        # keep the answer compact for the LLM; lineage available via planner\n        result.pop(\"execution_log\", None)\n        return json.dumps(result, indent=1, default=str)\n    except Exception as e:  # surface errors so the LLM can self-correct\n        return f\"QUERY ERROR: {e}\"\n\n\n@tool\ndef plan_and_retrieve(question: str) -> str:\n    \"\"\"Delegate a COMPLETE business question to the deterministic ontology\n    planner. It identifies concepts, navigates the federated ontology layers,\n    resolves physical sources, applies transformation rules, builds and runs a\n    retrieval plan, and returns structured JSON with the data AND a full\n    explainability trace. Use for straightforward analytical questions, or to\n    obtain the machine-readable explainability trace the user can audit.\"\"\"\n    try:\n        result = PLANNER.answer(question)\n        result[\"explainability\"].pop(\"8_execution_log\", None)  # keep compact\n        return json.dumps(result, indent=1, default=str)[:6000]\n    except Exception as e:\n        return f\"PLANNER ERROR: {e}\"\n\n\n@tool\ndef validate_data_product(dataset: str) -> str:\n    \"\"\"Validate a data product's CANONICAL view (all regions federated)\n    against its SHACL data-quality contract (mandatory fields, id patterns,\n    controlled vocabularies, numeric ranges, cross-field date rules).\n    dataset must be one of 'clients', 'orders', 'trades', 'contracts'.\n    Use when the user asks about data quality, validity, or trustworthiness.\"\"\"\n    from shacl_validate import validate_dataset\n    return json.dumps(validate_dataset(dataset), indent=1, default=str)\n\n\n_KG = None\n\n\ndef _kg():\n    global _KG\n    if _KG is None:\n        from knowledge_graph import build_knowledge_graph\n        _KG = build_knowledge_graph(federation=FED, store=STORE)\n    return _KG\n\n\n@tool\ndef explore_entity(identifier: str) -> str:\n    \"\"\"360-degree view of one entity in the federated knowledge graph: all\n    canonical attributes (with region provenance) plus inbound/outbound\n    relationships. identifier = canonical id (CL0103, ORD00242, TRD00307,\n    CON0211 \u2014 regional refs like EU-0103 are normalised to these) or a client\n    name fragment.\"\"\"\n    from knowledge_graph import entity_360\n    return json.dumps(entity_360(_kg(), identifier), indent=1)\n\n\n@tool\ndef sparql_query(query: str) -> str:\n    \"\"\"Read-only SPARQL SELECT/ASK over the federated knowledge graph\n    (ontology repository + canonical instances of all regions). Use for\n    multi-hop questions a single join can't express.\n\n    Prefixes: d: <http://example.org/finserv/data#> (attributes incl. d:region),\n    gb: <http://example.org/finserv/global#> (gb:placesOrder, gb:executesTrade,\n    gb:executionOf, gb:hasContract),\n    fs: <http://example.org/finserv#> (fs:classifiedAs),\n    tax: <http://example.org/finserv/taxonomy#>, skos standard.\n    Literals are plain strings/decimals/xsd:date. Use DISTINCT.\"\"\"\n    from knowledge_graph import run_sparql\n    try:\n        return json.dumps(run_sparql(_kg(), query), indent=1, default=str)\n    except Exception as e:\n        return f\"SPARQL ERROR: {e}\"\n\n\nTOOLS = [search_ontology, expand_taxonomy_concept, navigate_to_source,\n         query_data_product, plan_and_retrieve, validate_data_product,\n         explore_entity, sparql_query]\n\nSYSTEM_PROMPT = f\"\"\"You are a data product analyst agent for a financial services firm\nwith a FEDERATED data landscape: three regional systems (AMER, EMEA, APAC) hold\nclients, orders, trades and contracts in DIFFERENT local schemas, currencies and\ncode sets. A federated ontology stack unifies them at runtime:\n\n1. Global Business Ontology \u2014 canonical concepts, synonyms, join relationships\n2. Regional Ontology Extensions \u2014 regional vocabulary (incl. German terms) and\n   region-only concepts (e.g. MiFID category exists only in EMEA)\n3. Physical Data Mappings \u2014 bind each concept to each region's file/column\n4. Global Transformation & Calculation Rules \u2014 code decoding, id normalisation,\n   FX conversion to USD, derived measures (notional_usd, gross_amount_usd)\n\nMethod (follow strictly):\n1. Ground vocabulary with search_ontology (it covers regional synonyms too).\n2. Expand CATEGORY terms with expand_taxonomy_concept ('fixed income',\n   'professional clients', 'active orders', 'risky').\n3. Query with query_data_product using canonical columns; restrict \"regions\"\n   only when the user scopes the question to a region. Amounts are USD.\n4. For lineage questions ('where does X come from?', 'which transformations?'),\n   use navigate_to_source.\n5. For a complete auditable answer in one shot, or when the user wants the\n   explainability trace, use plan_and_retrieve.\n6. For entity 360s use explore_entity; for multi-hop graph questions use\n   sparql_query; for data-quality questions use validate_data_product.\n7. If a query errors, read the error and correct the spec.\n8. Answer concisely, citing figures. Mention which ontology layers, regions,\n   sources and transformation rules were involved. Never invent data.\n\n{FED.schema_summary()}\n\nTaxonomy hierarchies (SKOS):\n{FED.taxonomy_tree()}\n\"\"\"\n\n\n# ---------------------------------------------------------------- LLM\ndef make_llm():\n    provider = os.getenv(\"MODEL_PROVIDER\", \"anthropic\").lower()\n    if provider == \"openai\":\n        from langchain_openai import ChatOpenAI\n        return ChatOpenAI(model=os.getenv(\"OPENAI_MODEL\", \"gpt-4o\"), temperature=0)\n    from langchain_anthropic import ChatAnthropic\n    return ChatAnthropic(model=os.getenv(\"ANTHROPIC_MODEL\", \"claude-sonnet-4-5\"),\n                         temperature=0, max_tokens=2000)\n\n\n# ---------------------------------------------------------------- graph\nclass AgentState(TypedDict):\n    messages: Annotated[list[BaseMessage], add_messages]\n\n\ndef build_graph():\n    llm = make_llm().bind_tools(TOOLS)\n\n    def agent_node(state: AgentState):\n        msgs = [SystemMessage(content=SYSTEM_PROMPT)] + state[\"messages\"]\n        return {\"messages\": [llm.invoke(msgs)]}\n\n    def should_continue(state: AgentState):\n        last = state[\"messages\"][-1]\n        return \"tools\" if getattr(last, \"tool_calls\", None) else END\n\n    g = StateGraph(AgentState)\n    g.add_node(\"agent\", agent_node)\n    g.add_node(\"tools\", ToolNode(TOOLS))\n    g.set_entry_point(\"agent\")\n    g.add_conditional_edges(\"agent\", should_continue, {\"tools\": \"tools\", END: END})\n    g.add_edge(\"tools\", \"agent\")\n    return g.compile()\n\n\ndef chat():\n    \"\"\"Interactive REPL. Maintains conversation history across turns.\"\"\"\n    graph = build_graph()\n    history: list[BaseMessage] = []\n    print(\"Federated Data Product Agent \u2014 ask about clients, orders, trades, \"\n          \"contracts across AMER/EMEA/APAC. 'quit' to exit.\")\n    while True:\n        q = input(\"\\nYou: \").strip()\n        if q.lower() in (\"quit\", \"exit\", \"q\", \"\"):\n            break\n        history.append((\"user\", q))\n        result = graph.invoke({\"messages\": history})\n        history = result[\"messages\"]\n        print(\"\\nAgent:\", history[-1].content)\n\n\nif __name__ == \"__main__\":\n    chat()\n"}, {"name": "webapp.py", "lines": 532, "content": "\"\"\"Web UI for the federated ontology-driven data product agent.\n\nRun:  python webapp.py   ->  http://localhost:5001\n\nTabs:\n- Ask (planner)     \u2014 deterministic ontology-driven agent, NO key needed:\n                      final data in a table + full explainability trace\n- Agent chat        \u2014 LangGraph LLM agent (configure provider/model/key)\n- Federation        \u2014 the ontology repository, unified concepts, rules\n- Offline demo      \u2014 runs demo_offline.py end-to-end\n- README            \u2014 project documentation\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport subprocess\nimport sys\nimport traceback\n\nfrom flask import Flask, jsonify, request\n\nBASE = os.path.dirname(os.path.abspath(__file__))\napp = Flask(__name__)\napp.json.sort_keys = False        # keep explainability traces in pipeline order\n\nSTATE = {\"graph\": None, \"history\": [], \"provider\": None, \"model\": None,\n         \"planner\": None, \"fed\": None}\n\nDEFAULT_MODELS = {\"anthropic\": \"claude-sonnet-4-5\", \"openai\": \"gpt-4o\"}\n\n\ndef _planner():\n    if STATE[\"planner\"] is None:\n        from federation import FederatedOntology\n        from data_product import FederatedStore\n        from planner import OntologyPlannerAgent\n        fed = FederatedOntology()\n        STATE[\"fed\"] = fed\n        STATE[\"planner\"] = OntologyPlannerAgent(fed, FederatedStore(fed))\n    return STATE[\"planner\"]\n\n\n# ----------------------------------------------------------------- planner api\n@app.post(\"/api/ask\")\ndef ask():\n    question = (request.get_json(force=True).get(\"question\") or \"\").strip()\n    if not question:\n        return jsonify({\"ok\": False, \"error\": \"Empty question.\"}), 400\n    try:\n        result = _planner().answer(question)\n        return jsonify({\"ok\": True, \"result\": result})\n    except Exception as e:\n        return jsonify({\"ok\": False, \"error\": f\"{type(e).__name__}: {e}\",\n                        \"detail\": traceback.format_exc()[-800:]}), 500\n\n\n@app.get(\"/api/federation\")\ndef federation_info():\n    try:\n        p = _planner()\n        fed = STATE[\"fed\"]\n        concepts = []\n        for c in fed.concepts.values():\n            concepts.append({\n                \"label\": c.label, \"kind\": c.kind, \"dataset\": c.dataset,\n                \"canonical_column\": c.canonical_column,\n                \"measure\": c.is_measure,\n                \"regional_only\": c.regional_only,\n                \"global_synonyms\": \", \".join(c.synonyms[:6]),\n                \"regional_synonyms\": \"; \".join(\n                    f\"{r}: {', '.join(s[:4])}\" for r, s in c.regional_synonyms.items()),\n            })\n        rules = [{\"rule\": r.label, \"type\": r.rtype, \"detail\": r.describe(),\n                  \"comment\": r.comment} for r in fed.rules.values()]\n        return jsonify({\"ok\": True,\n                        \"inventory\": fed.repository_inventory(),\n                        \"concepts\": concepts,\n                        \"rules\": rules,\n                        \"taxonomy_tree\": fed.taxonomy_tree(),\n                        \"triples\": len(fed.graph)})\n    except Exception as e:\n        return jsonify({\"ok\": False, \"error\": f\"{type(e).__name__}: {e}\"}), 500\n\n\n# ----------------------------------------------------------------- llm api\n@app.post(\"/api/config\")\ndef configure():\n    body = request.get_json(force=True)\n    provider = (body.get(\"provider\") or \"anthropic\").lower()\n    model = body.get(\"model\") or DEFAULT_MODELS.get(provider, \"\")\n    key = (body.get(\"api_key\") or \"\").strip()\n    if not key:\n        return jsonify({\"ok\": False, \"error\": \"API key is required.\"}), 400\n    os.environ[\"MODEL_PROVIDER\"] = provider\n    if provider == \"openai\":\n        os.environ[\"OPENAI_API_KEY\"] = key\n        os.environ[\"OPENAI_MODEL\"] = model\n    else:\n        os.environ[\"ANTHROPIC_API_KEY\"] = key\n        os.environ[\"ANTHROPIC_MODEL\"] = model\n    try:\n        import agent\n        STATE[\"graph\"] = agent.build_graph()\n        STATE[\"history\"] = []\n        STATE[\"provider\"], STATE[\"model\"] = provider, model\n        return jsonify({\"ok\": True, \"provider\": provider, \"model\": model})\n    except Exception as e:\n        return jsonify({\"ok\": False, \"error\": f\"{type(e).__name__}: {e}\"}), 500\n\n\n@app.post(\"/api/chat\")\ndef chat():\n    if STATE[\"graph\"] is None:\n        return jsonify({\"ok\": False,\n                        \"error\": \"Not configured. Enter your model and API key first.\"}), 400\n    question = (request.get_json(force=True).get(\"message\") or \"\").strip()\n    if not question:\n        return jsonify({\"ok\": False, \"error\": \"Empty message.\"}), 400\n    try:\n        from langchain_core.messages import AIMessage, HumanMessage, ToolMessage\n        STATE[\"history\"].append(HumanMessage(content=question))\n        result = STATE[\"graph\"].invoke({\"messages\": STATE[\"history\"]},\n                                       config={\"recursion_limit\": 40})\n        msgs = result[\"messages\"]\n        last_h = max(i for i, m in enumerate(msgs) if isinstance(m, HumanMessage))\n        trace = []\n        for m in msgs[last_h + 1:]:\n            if isinstance(m, AIMessage):\n                for tc in (m.tool_calls or []):\n                    trace.append({\"type\": \"call\", \"tool\": tc[\"name\"],\n                                  \"args\": json.dumps(tc[\"args\"])[:400]})\n            elif isinstance(m, ToolMessage):\n                trace.append({\"type\": \"result\", \"tool\": m.name,\n                              \"content\": str(m.content)[:600]})\n        final = msgs[-1].content\n        if isinstance(final, list):  # anthropic content blocks\n            final = \"\".join(b.get(\"text\", \"\") for b in final if isinstance(b, dict))\n        STATE[\"history\"] = msgs\n        return jsonify({\"ok\": True, \"answer\": final, \"trace\": trace})\n    except Exception as e:\n        STATE[\"history\"] = STATE[\"history\"][:-1]\n        return jsonify({\"ok\": False, \"error\": f\"{type(e).__name__}: {e}\",\n                        \"detail\": traceback.format_exc()[-800:]}), 500\n\n\n@app.post(\"/api/reset\")\ndef reset():\n    STATE[\"history\"] = []\n    return jsonify({\"ok\": True})\n\n\n@app.post(\"/api/demo\")\ndef demo():\n    try:\n        proc = subprocess.run([sys.executable, \"-B\", os.path.join(BASE, \"demo_offline.py\")],\n                              capture_output=True, text=True, timeout=600, cwd=BASE)\n        out = proc.stdout + ((\"\\n[stderr]\\n\" + proc.stderr) if proc.returncode else \"\")\n        return jsonify({\"ok\": proc.returncode == 0, \"output\": out})\n    except Exception as e:\n        return jsonify({\"ok\": False, \"output\": f\"{type(e).__name__}: {e}\"}), 500\n\n\n@app.get(\"/api/readme\")\ndef readme():\n    try:\n        with open(os.path.join(BASE, \"README.md\"), encoding=\"utf-8\") as f:\n            return jsonify({\"ok\": True, \"markdown\": f.read()})\n    except FileNotFoundError:\n        return jsonify({\"ok\": False, \"markdown\": \"README.md not found.\"}), 404\n\n\n@app.get(\"/api/status\")\ndef status():\n    return jsonify({\"configured\": STATE[\"graph\"] is not None,\n                    \"provider\": STATE[\"provider\"], \"model\": STATE[\"model\"],\n                    \"turns\": len(STATE[\"history\"])})\n\n\n# ----------------------------------------------------------------- page\n@app.get(\"/\")\ndef index():\n    return PAGE\n\n\nPAGE = r\"\"\"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Federated Ontology Data Product Agent<\/title>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js\"><\/script>\n<style>\n  :root { --bg:#0f1420; --panel:#1a2233; --panel2:#222c42; --text:#e8ecf4;\n          --muted:#93a0b8; --accent:#5b9bff; --ok:#3ecf8e; --err:#ff6b6b;\n          --amber:#ffb454; --border:#2c3854; }\n  * { box-sizing:border-box; margin:0; }\n  body { background:var(--bg); color:var(--text);\n         font:15px/1.55 -apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif; }\n  header { padding:16px 28px; border-bottom:1px solid var(--border);\n           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }\n  header h1 { font-size:19px; }\n  header .sub { color:var(--muted); font-size:13px; }\n  main { max-width:1150px; margin:0 auto; padding:20px 24px 60px; }\n  button { background:var(--accent); color:#fff; border:0; border-radius:8px;\n           padding:9px 16px; font-size:14px; cursor:pointer; }\n  button:hover { filter:brightness(1.1); }\n  button.secondary { background:var(--panel2); border:1px solid var(--border); }\n  .tabs { display:flex; gap:8px; margin:4px 0 16px; flex-wrap:wrap; }\n  .tabs button { background:var(--panel2); border:1px solid var(--border); color:var(--muted); }\n  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }\n  .tab { display:none; } .tab.active { display:block; }\n  .row { display:flex; gap:10px; }\n  .row input { flex:1; background:var(--panel2); color:var(--text);\n      border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:14px; }\n  .hints { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }\n  .hints span { background:var(--panel2); border:1px solid var(--border); color:var(--muted);\n      border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; }\n  .hints span:hover { color:var(--text); border-color:var(--accent); }\n  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;\n          padding:16px 18px; margin-top:14px; }\n  .answer { font-size:15.5px; color:var(--ok); }\n  table.data { border-collapse:collapse; margin:10px 0; font-size:12.8px; width:100%; }\n  table.data th, table.data td { border:1px solid var(--border); padding:5px 9px;\n      text-align:left; white-space:nowrap; }\n  table.data th { background:var(--panel2); position:sticky; top:0; }\n  .tablewrap { overflow-x:auto; max-height:420px; overflow-y:auto;\n               border-radius:8px; }\n  details.exp { margin:8px 0; border:1px solid var(--border); border-radius:10px;\n                background:var(--panel); }\n  details.exp summary { padding:10px 14px; cursor:pointer; font-size:13.5px;\n                        color:var(--accent); user-select:none; }\n  details.exp[open] summary { border-bottom:1px solid var(--border); }\n  details.exp .inner { padding:10px 14px; }\n  pre.json { background:#0b1020; border:1px solid var(--border); border-radius:8px;\n             padding:10px 12px; overflow-x:auto; margin:6px 0;\n             font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; color:#c9d6ee;\n             white-space:pre-wrap; word-break:break-word; }\n  .steps li { margin:4px 0; color:#cfd8e8; font-size:13.5px; }\n  .pill { display:inline-block; border-radius:999px; padding:1px 9px; font-size:11.5px;\n          margin:1px 3px 1px 0; border:1px solid var(--border); color:var(--muted); }\n  .pill.global { color:var(--ok); border-color:var(--ok); }\n  .pill.regional { color:var(--amber); border-color:var(--amber); }\n  .config { background:var(--panel); border:1px solid var(--border); border-radius:12px;\n            padding:14px 16px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;\n            margin-bottom:14px; }\n  .config label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }\n  .config select,.config input { background:var(--panel2); color:var(--text);\n      border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; }\n  .config input[type=password] { width:270px; } .config input[type=text] { width:200px; }\n  .ok { color:var(--ok); } .err { color:var(--err); }\n  #chatlog { background:var(--panel); border:1px solid var(--border); border-radius:12px;\n             padding:16px; min-height:260px; max-height:520px; overflow-y:auto; }\n  .msg { margin:10px 0; max-width:88%; padding:10px 14px; border-radius:12px;\n         white-space:pre-wrap; word-wrap:break-word; }\n  .msg.user { background:var(--accent); color:#fff; margin-left:auto; }\n  .msg.agent { background:var(--panel2); }\n  .msg.info  { background:transparent; color:var(--muted); font-size:13px; padding:4px 2px; }\n  details.trace { margin:4px 0 12px; font-size:12.5px; color:var(--muted); }\n  details.trace pre { background:#131a2a; border:1px solid var(--border); border-radius:8px;\n                      padding:8px 10px; overflow-x:auto; margin:6px 0; }\n  #demoOut { background:#0b1020; border:1px solid var(--border); border-radius:12px;\n             padding:16px; font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;\n             white-space:pre-wrap; max-height:560px; overflow-y:auto; color:#c9d6ee; }\n  #readme { background:var(--panel); border:1px solid var(--border); border-radius:12px;\n            padding:26px 30px; }\n  #readme h1,#readme h2,#readme h3 { margin:18px 0 8px; } #readme h1 { font-size:22px; }\n  #readme p,#readme li { color:#cfd8e8; margin:6px 0; }\n  #readme code { background:#131a2a; border-radius:5px; padding:1px 6px;\n                 font:12.5px ui-monospace,Menlo,Consolas,monospace; color:#9fc1ff; }\n  #readme pre { background:#0b1020; border:1px solid var(--border); border-radius:8px;\n                padding:12px; overflow-x:auto; margin:10px 0; }\n  #readme pre code { background:none; padding:0; }\n  #readme table { border-collapse:collapse; margin:12px 0; font-size:13.5px; }\n  #readme th,#readme td { border:1px solid var(--border); padding:7px 11px; text-align:left; }\n  #readme th { background:var(--panel2); }\n  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted);\n          border-top-color:transparent; border-radius:50%; animation:r .8s linear infinite;\n          vertical-align:-2px; margin-right:6px; }\n  @keyframes r { to { transform:rotate(360deg); } }\n  h3.sect { font-size:15px; margin:18px 0 6px; color:var(--text); }\n  pre.tree { background:#0b1020; border:1px solid var(--border); border-radius:8px;\n             padding:12px; font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;\n             color:#c9d6ee; overflow-x:auto; }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Federated Ontology Data Product Agent<\/h1>\n  <span class=\"sub\">AMER \u00b7 EMEA \u00b7 APAC \u2014 global ontology + regional extensions + physical mappings + transformation rules<\/span>\n<\/header>\n<main>\n  <div class=\"tabs\">\n    <button id=\"tab-ask\" class=\"active\" onclick=\"show('ask')\">Ask (planner)<\/button>\n    <button id=\"tab-chat\" onclick=\"show('chat')\">Agent chat (LLM)<\/button>\n    <button id=\"tab-fed\" onclick=\"show('fed')\">Federation<\/button>\n    <button id=\"tab-demo\" onclick=\"show('demo')\">Offline demo<\/button>\n    <button id=\"tab-readme\" onclick=\"show('readme')\">README<\/button>\n  <\/div>\n\n  <!-- ================= ASK (planner) ================= -->\n  <section id=\"ask\" class=\"tab active\">\n    <p style=\"color:var(--muted);margin-bottom:10px;font-size:13.5px\">\n      The deterministic ontology-driven agent \u2014 no API key needed. It identifies\n      concepts, navigates the federated ontology layers, resolves physical\n      sources, applies transformation rules, plans, retrieves, and explains itself.<\/p>\n    <div class=\"row\">\n      <input id=\"q\" placeholder=\"e.g. What is our fixed income exposure to professional clients in EMEA?\"\n             onkeydown=\"if(event.key==='Enter')askQ()\">\n      <button onclick=\"askQ()\">Ask<\/button>\n    <\/div>\n    <div class=\"hints\" id=\"hints\"><\/div>\n    <div id=\"askOut\"><\/div>\n  <\/section>\n\n  <!-- ================= AGENT CHAT (LLM) ================= -->\n  <section id=\"chat\" class=\"tab\">\n    <div class=\"config\">\n      <div><label>Provider<\/label>\n        <select id=\"provider\" onchange=\"providerChanged()\">\n          <option value=\"anthropic\">Anthropic<\/option>\n          <option value=\"openai\">OpenAI<\/option>\n        <\/select><\/div>\n      <div><label>Model<\/label><input type=\"text\" id=\"model\" value=\"claude-sonnet-4-5\"><\/div>\n      <div><label>API key (kept in memory only)<\/label>\n        <input type=\"password\" id=\"apikey\" placeholder=\"sk-ant-...\"><\/div>\n      <button onclick=\"saveConfig()\">Connect<\/button>\n      <span id=\"cfgStatus\" class=\"sub\">not configured<\/span>\n    <\/div>\n    <div id=\"chatlog\"><div class=\"msg info\">Connect a model above, then chat \u2014 the LLM uses the same federated semantic layer through its tools.<\/div><\/div>\n    <div class=\"row\" style=\"margin-top:12px\">\n      <input id=\"cq\" placeholder=\"e.g. Which clients with failed trades have active contracts?\"\n             onkeydown=\"if(event.key==='Enter')send()\">\n      <button onclick=\"send()\">Send<\/button>\n      <button class=\"secondary\" onclick=\"resetChat()\">Reset<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- ================= FEDERATION ================= -->\n  <section id=\"fed\" class=\"tab\">\n    <div id=\"fedOut\"><span class=\"spin\"><\/span>loading ontology repository\u2026<\/div>\n  <\/section>\n\n  <!-- ================= DEMO ================= -->\n  <section id=\"demo\" class=\"tab\">\n    <p style=\"color:var(--muted);margin-bottom:12px\">Runs <code style=\"color:#9fc1ff\">demo_offline.py<\/code>:\n      repository discovery, federated vocabulary, ontology navigation, canonicalisation,\n      planner Q&amp;A, SHACL contracts and knowledge-graph SPARQL \u2014 no API key needed.<\/p>\n    <button onclick=\"runDemo()\">Run demonstration<\/button>\n    <div id=\"demoOut\" style=\"margin-top:14px\">Output will appear here.<\/div>\n  <\/section>\n\n  <section id=\"readme\" class=\"tab\"><div id=\"readmeInner\">Loading\u2026<\/div><\/section>\n<\/main>\n\n<script>\nconst HINTS = [\n  \"Which customers are risky?\",\n  \"Total AUM of HNW investors\",\n  \"What is our fixed income exposure to professional clients in EMEA?\",\n  \"Notional by asset class for German clients\",\n  \"How many active orders per region?\",\n  \"What is the MiFID category of German clients?\",\n  \"Show fills that failed settlement\",\n  \"Total book size of accounts in APAC\"\n];\nconst hintBox = document.getElementById('hints');\nHINTS.forEach(h => { const s = document.createElement('span'); s.textContent = h;\n  s.onclick = () => { document.getElementById('q').value = h; askQ(); }; hintBox.appendChild(s); });\n\nfunction show(name){\n  for (const t of ['ask','chat','fed','demo','readme']) {\n    document.getElementById(t).classList.toggle('active', t===name);\n    document.getElementById('tab-'+t).classList.toggle('active', t===name);\n  }\n  if (name==='fed' && !window._fedLoaded) loadFederation();\n}\nfunction esc(s){ const d=document.createElement('div'); d.textContent=String(s??''); return d.innerHTML; }\nfunction fmt(v){\n  if (v===null||v===undefined) return '';\n  if (typeof v==='number') return v.toLocaleString();\n  return String(v);\n}\nfunction renderTable(rows){\n  if (!rows || !rows.length) return '<p style=\"color:var(--muted)\">No rows.<\/p>';\n  const cols = Object.keys(rows[0]);\n  let h = '<div class=\"tablewrap\"><table class=\"data\"><tr>' +\n    cols.map(c=>'<th>'+esc(c)+'<\/th>').join('') + '<\/tr>';\n  rows.forEach(r => { h += '<tr>' + cols.map(c=>'<td>'+esc(fmt(r[c]))+'<\/td>').join('') + '<\/tr>'; });\n  return h + '<\/table><\/div>';\n}\nfunction jsonBlock(o){ return '<pre class=\"json\">'+esc(JSON.stringify(o,null,1))+'<\/pre>'; }\nfunction expSection(title, inner, open){\n  return '<details class=\"exp\"'+(open?' open':'')+'><summary>'+esc(title)+\n         '<\/summary><div class=\"inner\">'+inner+'<\/div><\/details>';\n}\n\nasync function askQ(){\n  const q = document.getElementById('q').value.trim();\n  if (!q) return;\n  const out = document.getElementById('askOut');\n  out.innerHTML = '<div class=\"card\"><span class=\"spin\"><\/span>federating\u2026<\/div>';\n  try {\n    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({question: q})});\n    const j = await r.json();\n    if (!j.ok) { out.innerHTML = '<div class=\"card err\">'+esc(j.error)+'<\/div>'; return; }\n    const res = j.result, ex = res.explainability, data = res.data;\n    let h = '<div class=\"card\"><div class=\"answer\">'+esc(res.answer_summary)+'<\/div>';\n    if (data.rows) h += renderTable(data.rows);\n    else if ('result' in data) h += '<p style=\"font-size:22px;margin-top:8px\">'+fmt(data.result)+'<\/p>';\n    else if (data.error) h += '<p class=\"err\">'+esc(data.error)+'<\/p>';\n    h += '<\/div>';\n\n    // explainability trace\n    const c = ex['2_concepts_identified'].map(x =>\n      '<span class=\"pill '+((x.vocabulary_layer||'').startsWith('regional')?'regional':'global')+'\">'+\n      esc(x.matched_name||x.label)+' \u2192 '+esc(x.label)+' ['+esc(x.vocabulary_layer)+']<\/span>').join(' ');\n    const tax = ex['2b_taxonomy_expansions'].map(t =>\n      '<p style=\"font-size:13px;margin:6px 0\"><b>'+esc(t.concept)+'<\/b> ('+esc(t.scheme)+') \u2192 '+\n      esc(JSON.stringify(t.filter_suggestion))+'<\/p><pre class=\"json\">'+esc(t.hierarchy.join('\\n'))+'<\/pre>').join('');\n    const nav = ex['4_ontology_navigation'].map(n =>\n      '<p style=\"font-size:13px;margin:4px 0\"><b>'+esc(n.concept)+'<\/b><\/p>'+jsonBlock(n.resolution)).join('');\n    const srcs = renderTable(ex['5_sources_selected']);\n    const trans = renderTable(ex['6_transformations_applied']);\n    const plan = '<ol class=\"steps\">'+ex['7_retrieval_plan'].steps.map(s=>'<li>'+esc(s)+'<\/li>').join('')+\n      '<\/ol>'+jsonBlock(ex['7_retrieval_plan'].query_spec);\n    h += '<h3 class=\"sect\">Explainability trace<\/h3>';\n    h += expSection('1 \u00b7 Intent', jsonBlock(ex['1_intent']));\n    h += expSection('2 \u00b7 Concepts identified (vocabulary provenance)', c || '<p style=\"color:var(--muted)\">none<\/p>', true);\n    if (ex['2b_taxonomy_expansions'].length) h += expSection('2b \u00b7 Taxonomy expansions (SKOS)', tax);\n    h += expSection('3 \u00b7 Domains determined', jsonBlock(ex['3_domains_determined']));\n    h += expSection('4 \u00b7 Ontology navigation \u2192 physical sources', nav || '<p style=\"color:var(--muted)\">none<\/p>');\n    h += expSection('5 \u00b7 Sources selected', srcs);\n    h += expSection('6 \u00b7 Transformation & calculation rules applied', trans);\n    h += expSection('7 \u00b7 Retrieval plan', plan);\n    h += expSection('8 \u00b7 Execution log', jsonBlock(ex['8_execution_log']));\n    h += expSection('Full JSON output', jsonBlock(res));\n    out.innerHTML = h;\n  } catch(e){ out.innerHTML = '<div class=\"card err\">Request failed: '+esc(e)+'<\/div>'; }\n}\n\nasync function loadFederation(){\n  window._fedLoaded = true;\n  const out = document.getElementById('fedOut');\n  try {\n    const r = await fetch('/api/federation'); const j = await r.json();\n    if (!j.ok) { out.innerHTML = '<p class=\"err\">'+esc(j.error)+'<\/p>'; return; }\n    let h = '<h3 class=\"sect\">Ontology repository (auto-discovered \u2014 '+j.triples+' triples)<\/h3>';\n    h += renderTable(j.inventory);\n    h += '<h3 class=\"sect\">Unified business concepts (global + regional)<\/h3>';\n    h += renderTable(j.concepts.filter(c=>c.kind!=='object_property'));\n    h += '<h3 class=\"sect\">Relationships (join paths)<\/h3>';\n    h += renderTable(j.concepts.filter(c=>c.kind==='object_property'));\n    h += '<h3 class=\"sect\">Global transformation & calculation rules<\/h3>';\n    h += renderTable(j.rules);\n    h += '<h3 class=\"sect\">SKOS taxonomies<\/h3><pre class=\"tree\">'+esc(j.taxonomy_tree)+'<\/pre>';\n    out.innerHTML = h;\n  } catch(e){ out.innerHTML = '<p class=\"err\">'+esc(e)+'<\/p>'; }\n}\n\nfunction providerChanged(){\n  const p = document.getElementById('provider').value;\n  document.getElementById('model').value = p==='openai' ? 'gpt-4o' : 'claude-sonnet-4-5';\n  document.getElementById('apikey').placeholder = p==='openai' ? 'sk-...' : 'sk-ant-...';\n}\nasync function saveConfig(){\n  const st = document.getElementById('cfgStatus');\n  st.className=''; st.innerHTML = '<span class=\"spin\"><\/span>connecting\u2026';\n  const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'},\n    body: JSON.stringify({provider: provider.value, model: model.value, api_key: apikey.value})});\n  const j = await r.json();\n  st.className = j.ok ? 'ok' : 'err';\n  st.textContent = j.ok ? `connected \u2014 ${j.provider} / ${j.model}` : j.error;\n}\nfunction add(cls, text){\n  const log = document.getElementById('chatlog');\n  const d = document.createElement('div'); d.className = 'msg '+cls; d.textContent = text;\n  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;\n}\nfunction addTrace(trace){\n  if (!trace || !trace.length) return;\n  const log = document.getElementById('chatlog');\n  const det = document.createElement('details'); det.className='trace';\n  const sum = document.createElement('summary');\n  sum.textContent = `tool activity (${trace.filter(t=>t.type==='call').length} calls)`;\n  det.appendChild(sum);\n  trace.forEach(t => { const pre = document.createElement('pre');\n    pre.textContent = t.type==='call' ? `-> ${t.tool}(${t.args})` : `<- ${t.tool}: ${t.content}`;\n    det.appendChild(pre); });\n  log.appendChild(det); log.scrollTop = log.scrollHeight;\n}\nasync function send(){\n  const box = document.getElementById('cq'); const msg = box.value.trim();\n  if (!msg) return; box.value='';\n  add('user', msg);\n  const busy = add('info', ''); busy.innerHTML = '<span class=\"spin\"><\/span>agent working\u2026';\n  try {\n    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({message: msg})});\n    const j = await r.json(); busy.remove();\n    if (j.ok) { addTrace(j.trace); add('agent', j.answer); }\n    else add('agent', 'Error: ' + j.error);\n  } catch(e){ busy.remove(); add('agent', 'Request failed: ' + e); }\n}\nasync function resetChat(){\n  await fetch('/api/reset', {method:'POST'});\n  document.getElementById('chatlog').innerHTML =\n    '<div class=\"msg info\">Conversation reset.<\/div>';\n}\nasync function runDemo(){\n  const out = document.getElementById('demoOut');\n  out.innerHTML = '<span class=\"spin\"><\/span>running demonstration (builds the knowledge graph \u2014 ~60s)\u2026';\n  const r = await fetch('/api/demo', {method:'POST'});\n  const j = await r.json();\n  out.textContent = j.output || 'no output';\n}\n(async () => {\n  const r = await fetch('/api/readme'); const j = await r.json();\n  document.getElementById('readmeInner').innerHTML =\n    (window.marked && j.ok) ? marked.parse(j.markdown) : '<pre>'+ (j.markdown||'') +'<\/pre>';\n})();\n<\/script>\n<\/body>\n<\/html>\n\"\"\"\n\nif __name__ == \"__main__\":\n    port = int(os.getenv(\"PORT\", \"5001\"))\n    print(f\"Open http://localhost:{port}\")\n    app.run(host=\"127.0.0.1\", port=port, debug=False)\n"}, {"name": "demo_offline.py", "lines": 120, "content": "\"\"\"Offline demonstration \u2014 exercises the full federated stack without an LLM key.\n\nWalks through: repository discovery -> unified semantic context (global +\nregional vocabulary) -> ontology navigation -> canonicalisation with global\ntransformation rules -> the deterministic planner agent (JSON output with\nexplainability trace) -> SHACL contracts -> knowledge-graph SPARQL.\n\"\"\"\nimport json\n\nfrom data_product import FederatedStore\nfrom federation import FederatedOntology\nfrom planner import OntologyPlannerAgent\n\nfed = FederatedOntology()\nstore = FederatedStore(fed)\nagent = OntologyPlannerAgent(fed, store)\n\nprint(\"=\" * 72)\nprint(\"1. ONTOLOGY REPOSITORY (auto-discovered at runtime)\")\nfor f in fed.repository_inventory():\n    print(f\"   [{f['layer']:<20}] {f['region'] or '-':<5} {f['file']} \"\n          f\"({f['triples']} triples)\")\nprint(f\"   => unified graph: {len(fed.graph)} triples, {len(fed.concepts)} \"\n      f\"concepts, {len(fed.rules)} rules, {len(fed.tax_concepts)} taxonomy concepts\")\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"2. FEDERATED VOCABULARY (global + regional extensions)\")\nfor phrase in [\"risky kunden\", \"book size of accounts\", \"mifid category\", \"counter\"]:\n    print(f\"\\n   resolve('{phrase}'):\")\n    for m in fed.resolve(phrase, top_k=2):\n        print(f\"     -> {m['label']}  [{m['vocabulary_layer']}]\"\n              f\"  matched '{m['matched_name']}'\"\n              + (f\"  => {m.get('dataset')}.{m.get('canonical_column')}\"\n                 if m.get('canonical_column') else \"\"))\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"3. ONTOLOGY NAVIGATION: canonical concept -> regional physical sources\")\nfor step in fed.navigate(\"clients\", \"segment\"):\n    print(\"  \", json.dumps(step))\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"4. CANONICALISATION (physical mappings + global transformation rules)\")\ndf, _ = store.combined_frame(\"clients\")\nprint(df[[\"client_id\", \"client_name\", \"segment\", \"country\", \"risk_rating\",\n          \"aum_usd_mm\", \"region\"]].iloc[[0, 12, 24]].to_string(index=False))\nprint(\"\\n   EMEA transformation log:\")\nfor entry in store._transform_log[(\"EMEA\", \"clients\")]:\n    print(\"   \", json.dumps(entry)[:150])\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"5. ONTOLOGY-DRIVEN PLANNER AGENT (JSON output + explainability trace)\")\nQUESTIONS = [\n    \"Which customers are risky?\",\n    \"Total AUM of HNW investors\",\n    \"What is our fixed income exposure to professional clients in EMEA?\",\n    \"Notional by asset class for German clients\",\n    \"How many active orders per region?\",\n    \"What is the MiFID category of German clients?\",\n]\nfor q in QUESTIONS:\n    r = agent.answer(q)\n    ex = r[\"explainability\"]\n    print(\"\\n\" + \"-\" * 72)\n    print(\"Q:\", q)\n    print(\"A:\", r[\"answer_summary\"])\n    print(\"   concepts  :\", [(c.get(\"matched_name\"), c.get(\"vocabulary_layer\"))\n                             for c in ex[\"2_concepts_identified\"]])\n    print(\"   taxonomy  :\", [t[\"concept\"] for t in ex[\"2b_taxonomy_expansions\"]])\n    print(\"   domains   :\", ex[\"3_domains_determined\"])\n    print(\"   sources   :\", [s[\"file\"] for s in ex[\"5_sources_selected\"]])\n    print(\"   transforms:\", sorted({t[\"rule\"] for t in ex[\"6_transformations_applied\"]}))\n    print(\"   plan      :\", json.dumps(ex[\"7_retrieval_plan\"][\"query_spec\"]))\n\nprint(\"\\n   Full JSON for the last question (truncated):\")\nprint(json.dumps(r, indent=1, default=str)[:1800])\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"6. SHACL DATA CONTRACTS (three regional schemas -> ONE global contract)\")\nfrom shacl_validate import validate_dataset\nfor ds in (\"clients\", \"orders\", \"trades\", \"contracts\"):\n    rep = validate_dataset(ds)\n    print(f\"   {ds}: rows={rep['rows_validated']} conforms={rep['conforms']} \"\n          f\"violations={rep['violation_count']}\")\n\nprint(\"\\n\" + \"=\" * 72)\nprint(\"7. KNOWLEDGE GRAPH (federated canonical instances + all ontology layers)\")\nfrom knowledge_graph import build_knowledge_graph, entity_360, run_sparql\nkg = build_knowledge_graph(federation=fed, store=store)\nprint(f\"   {len(kg)} triples\")\ne = entity_360(kg, \"CL0103\")\nprint(f\"   entity_360('CL0103'): {e['attributes'].get('client_name')} \"\n      f\"[{e['attributes'].get('region')}] \u2014 {e['outgoing_total']} outgoing, \"\n      f\"{e['incoming_total']} incoming links\")\n\nprint(\"\\n   SPARQL: failed-settlement clients across all three regions\")\nfor row in run_sparql(kg, '''\n    PREFIX d: <http://example.org/finserv/data#>\n    PREFIX gb: <http://example.org/finserv/global#>\n    SELECT ?name ?region (COUNT(?t) AS ?failed) WHERE {\n        ?t d:settlement_status \"Failed\" .\n        ?c gb:executesTrade ?t ; d:client_name ?name ; d:region ?region .\n    } GROUP BY ?name ?region ORDER BY DESC(?failed) LIMIT 3'''):\n    print(\"   \", row)\n\nprint(\"\\n   SPARQL: multi-hop \u2014 active contracts of clients with failed trades\")\nfor row in run_sparql(kg, '''\n    PREFIX d: <http://example.org/finserv/data#>\n    PREFIX gb: <http://example.org/finserv/global#>\n    SELECT DISTINCT ?name ?region ?contract ?type WHERE {\n        ?t d:settlement_status \"Failed\" .\n        ?c gb:executesTrade ?t ; d:client_name ?name ; d:region ?region ;\n           gb:hasContract ?con .\n        ?con d:contract_status \"Active\" ; d:contract_id ?contract ;\n             d:contract_type ?type .\n    } LIMIT 5'''):\n    print(\"   \", row)\n\nprint(\"\\nOffline demo complete. Run `python webapp.py` for the UI, or \"\n      \"`python agent.py` with an API key for the conversational LLM agent.\")\n"}, {"name": "generate_data.py", "lines": 328, "content": "\"\"\"Generate synthetic REGIONAL data sources for the federated prototype.\n\nThree regions, each with its own local schema, codes and currency:\n\n  data/amer/  \u2014 canonical-style column names, full-word values, USD\n  data/emea/  \u2014 European source system: *_ref columns, code values\n                (INST/RET/..., OPN/FIL/...), amounts in EUR, extra\n                MiFID category column\n  data/apac/  \u2014 Asian source system: acct_no/ord_no columns, single-letter\n                codes (I/R/H/C, O/F/PF/...), amounts in SGD\n\nThe regional files deliberately do NOT share a schema: the federated\nontology layer (regional extensions + physical mappings + global\ntransformation rules) is what unifies them at runtime.\n\nNote: order notional and trade gross amounts are NOT stored in any region \u2014\nthey are derived by the global calculation rules at runtime.\n\"\"\"\nimport os\nimport random\nfrom datetime import date, timedelta\n\nimport pandas as pd\n\nrandom.seed(42)\nOUT = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"data\")\n\nFIRST = [\"Aarav\", \"Meera\", \"James\", \"Sofia\", \"Wei\", \"Priya\", \"Liam\", \"Fatima\",\n         \"Noah\", \"Yuki\", \"Elena\", \"Rahul\", \"Grace\", \"Omar\", \"Isabella\", \"Kenji\"]\nLAST = [\"Sharma\", \"Chen\", \"Smith\", \"Garcia\", \"Patel\", \"Kim\", \"Mueller\", \"Rossi\",\n        \"Tanaka\", \"Okafor\", \"Silva\", \"Novak\", \"Ahmed\", \"Brown\", \"Iyer\", \"Dubois\"]\nORGS = [\"Apex Capital\", \"BlueRiver Asset Mgmt\", \"Cedar Pension Fund\",\n        \"Delta Hedge Partners\", \"Everest Sovereign Fund\", \"Falcon Family Office\",\n        \"Granite Insurance Co\", \"Horizon Endowment\", \"Indigo Wealth\",\n        \"Juniper Retail Brokers\", \"Kestrel Partners\", \"Lotus Holdings\"]\n\n\ndef rand_date(start: date, end: date) -> date:\n    return start + timedelta(days=random.randint(0, (end - start).days))\n\n\ndef person() -> str:\n    return f\"{random.choice(FIRST)} {random.choice(LAST)}\"\n\n\n# =====================================================================\n# Region definitions (id offsets keep canonical ids globally unique)\n# =====================================================================\nREGIONS = {\n    \"amer\": {\n        \"client_offset\": 0, \"order_offset\": 0, \"contract_offset\": 0,\n        \"n_clients\": 12, \"n_orders\": 70, \"n_contracts\": 20,\n        \"countries\": [\"USA\", \"Canada\", \"Brazil\", \"Mexico\"],\n        \"venues\": [\"NYSE\", \"NASDAQ\", \"TSX\"],\n        \"brokers\": [\"Goldman Sachs\", \"Morgan Stanley\", \"Citi\"],\n        \"laws\": [\"New York\", \"English\"],\n        \"instruments\": [  # (symbol, name, asset_class)\n            (\"AAPL\", \"Apple Inc\", \"Equity\"), (\"MSFT\", \"Microsoft Corp\", \"Equity\"),\n            (\"JPM\", \"JPMorgan Chase\", \"Equity\"), (\"PFE\", \"Pfizer Inc\", \"Equity\"),\n            (\"XOM\", \"Exxon Mobil\", \"Equity\"), (\"TSLA\", \"Tesla Inc\", \"Equity\"),\n            (\"US10Y\", \"US Treasury 10Y\", \"Bond\"),\n            (\"GLD-FUT\", \"Gold Futures\", \"Derivative\"),\n            (\"SPX-OPT\", \"S&P 500 Options\", \"Derivative\"),\n        ],\n    },\n    \"emea\": {\n        \"client_offset\": 100, \"order_offset\": 100, \"contract_offset\": 100,\n        \"n_clients\": 12, \"n_orders\": 70, \"n_contracts\": 20,\n        \"countries\": [\"DE\", \"GB\", \"FR\", \"CH\", \"NL\", \"IT\"],   # ISO codes\n        \"venues\": [\"XETRA\", \"LSE\", \"EURONEXT\"],\n        \"brokers\": [\"Deutsche Bank\", \"Barclays\", \"BNP Paribas\", \"UBS\"],\n        \"laws\": [\"EN\", \"NY\"],                                 # codes\n        \"instruments\": [\n            (\"SAP\", \"SAP SE\", \"EQ\"), (\"SIE\", \"Siemens AG\", \"EQ\"),\n            (\"HSBA\", \"HSBC Holdings\", \"EQ\"), (\"AZN\", \"AstraZeneca\", \"EQ\"),\n            (\"DE05Y\", \"German Bund 5Y\", \"FI\"), (\"GB10Y\", \"UK Gilt 10Y\", \"FI\"),\n            (\"DAX-OPT\", \"DAX Options\", \"DRV\"),\n        ],\n    },\n    \"apac\": {\n        \"client_offset\": 200, \"order_offset\": 200, \"contract_offset\": 200,\n        \"n_clients\": 12, \"n_orders\": 70, \"n_contracts\": 20,\n        \"countries\": [\"SG\", \"JP\", \"AU\", \"HK\", \"IN\"],          # domicile codes\n        \"venues\": [\"SGX\", \"TSE\", \"ASX\", \"HKEX\"],\n        \"brokers\": [\"Nomura\", \"DBS\", \"Macquarie\", \"HSBC\"],\n        \"laws\": [\"Singapore\", \"English\"],\n        \"instruments\": [\n            (\"DBSM\", \"DBS Group\", \"EQUITY\"), (\"TYT\", \"Toyota Motor\", \"EQUITY\"),\n            (\"BHP\", \"BHP Group\", \"EQUITY\"), (\"TCEH\", \"Tencent Holdings\", \"EQUITY\"),\n            (\"SG10Y\", \"Singapore Govt 10Y\", \"BOND\"), (\"JP10Y\", \"JGB 10Y\", \"BOND\"),\n            (\"NKY-FUT\", \"Nikkei 225 Futures\", \"DERIV\"),\n        ],\n    },\n}\n\nSEGMENTS = [\"Institutional\", \"Retail\", \"High Net Worth\", \"Corporate\"]\nSEG_CODE = {\"Institutional\": \"INST\", \"Retail\": \"RET\",\n            \"High Net Worth\": \"HNW\", \"Corporate\": \"CORP\"}\nSEG_TIER = {\"Institutional\": \"I\", \"Retail\": \"R\",\n            \"High Net Worth\": \"H\", \"Corporate\": \"C\"}\nRISK = [\"Low\", \"Medium\", \"High\"]\nRISK_CLASS = {\"Low\": 1, \"Medium\": 2, \"High\": 3}\nRISK_GRADE = {\"Low\": \"L\", \"Medium\": \"M\", \"High\": \"H\"}\nKYC = [\"Verified\", \"Pending\", \"Expired\"]\nKYC_EMEA = {\"Verified\": \"OK\", \"Pending\": \"IN_PROGRESS\", \"Expired\": \"LAPSED\"}\nKYC_APAC = {\"Verified\": \"VERIFIED\", \"Pending\": \"PENDING\", \"Expired\": \"EXPIRED\"}\nMIFID = [\"Eligible Counterparty\", \"Professional\", \"Retail\"]\nORDER_STATUS = [\"Filled\", \"Partially Filled\", \"Cancelled\", \"Open\", \"Rejected\"]\nSTATUS_EMEA = {\"Filled\": \"FIL\", \"Partially Filled\": \"PFL\", \"Cancelled\": \"CXL\",\n               \"Open\": \"OPN\", \"Rejected\": \"REJ\"}\nSTATUS_APAC = {\"Filled\": \"F\", \"Partially Filled\": \"PF\", \"Cancelled\": \"C\",\n               \"Open\": \"O\", \"Rejected\": \"R\"}\nORDER_TYPES = [\"Market\", \"Limit\", \"Stop\", \"Stop-Limit\"]\nOTYPE_EMEA = {\"Market\": \"MKT\", \"Limit\": \"LMT\", \"Stop\": \"STP\", \"Stop-Limit\": \"SLM\"}\nOTYPE_APAC = {\"Market\": \"M\", \"Limit\": \"L\", \"Stop\": \"S\", \"Stop-Limit\": \"SL\"}\nSETTLE = [\"Settled\", \"Pending\", \"Failed\"]\nSETTLE_EMEA = {\"Settled\": \"STLD\", \"Pending\": \"PNDG\", \"Failed\": \"FAIL\"}\nSETTLE_APAC = {\"Settled\": \"S\", \"Pending\": \"P\", \"Failed\": \"F\"}\nCONTRACT_TYPES = [\"ISDA Master\", \"Prime Brokerage\", \"Custody Agreement\",\n                  \"Advisory Mandate\", \"Repo Agreement\"]\nCTYPE_CODE = {\"ISDA Master\": \"ISDA\", \"Prime Brokerage\": \"PB\",\n              \"Custody Agreement\": \"CUST\", \"Advisory Mandate\": \"ADV\",\n              \"Repo Agreement\": \"REPO\"}\nCONTRACT_STATUS = [\"Active\", \"Expired\", \"Under Negotiation\", \"Terminated\"]\nCSTAT_EMEA = {\"Active\": \"LIVE\", \"Expired\": \"EXP\",\n              \"Under Negotiation\": \"NEG\", \"Terminated\": \"TERM\"}\nCSTAT_APAC = {\"Active\": \"A\", \"Expired\": \"E\",\n              \"Under Negotiation\": \"N\", \"Terminated\": \"T\"}\n\n\ndef make_region(region: str, cfg: dict) -> dict[str, pd.DataFrame]:\n    \"\"\"Generate the four datasets for one region in CANONICAL form first,\n    then project them to the region's local schema.\"\"\"\n    # ---- canonical-ish internal rows -------------------------------------\n    clients = []\n    for i in range(1, cfg[\"n_clients\"] + 1):\n        n = cfg[\"client_offset\"] + i\n        seg = random.choice(SEGMENTS)\n        name = f\"{random.choice(ORGS)} {n}\" if seg in (\"Institutional\", \"Corporate\") \\\n            else person()\n        clients.append({\n            \"n\": n, \"name\": name, \"segment\": seg,\n            \"country\": random.choice(cfg[\"countries\"]),\n            \"risk\": random.choice(RISK),\n            \"kyc\": random.choices(KYC, [0.8, 0.12, 0.08])[0],\n            \"onboarded\": rand_date(date(2018, 1, 1), date(2025, 6, 30)),\n            \"rm\": person(),\n            \"aum\": round(random.uniform(0.5, 2500), 2),\n            \"email\": f\"contact{n}@example.com\",\n            \"mifid\": random.choice(MIFID),\n        })\n\n    orders = []\n    for i in range(1, cfg[\"n_orders\"] + 1):\n        n = cfg[\"order_offset\"] + i\n        cl = random.choice(clients)\n        sym, iname, acls = random.choice(cfg[\"instruments\"])\n        qty = random.choice([100, 250, 500, 1000, 2500, 5000, 10000])\n        px = round(random.uniform(10, 950), 2)\n        orders.append({\n            \"n\": n, \"client_n\": cl[\"n\"], \"symbol\": sym, \"iname\": iname,\n            \"acls\": acls, \"side\": random.choice([\"Buy\", \"Sell\"]),\n            \"otype\": random.choice(ORDER_TYPES), \"qty\": qty, \"px\": px,\n            \"status\": random.choices(ORDER_STATUS, [0.55, 0.15, 0.12, 0.1, 0.08])[0],\n            \"date\": rand_date(date(2024, 1, 1), date(2026, 6, 30)),\n            \"venue\": random.choice(cfg[\"venues\"]),\n        })\n\n    trades, t = [], 0\n    for o in orders:\n        if o[\"status\"] not in (\"Filled\", \"Partially Filled\"):\n            continue\n        n_fills = 1 if o[\"status\"] == \"Filled\" and random.random() < 0.7 \\\n            else random.randint(1, 3)\n        remaining = o[\"qty\"]\n        for f in range(n_fills):\n            t += 1\n            qty = remaining if f == n_fills - 1 \\\n                else max(1, remaining // random.randint(2, 3))\n            remaining -= qty\n            px = round(o[\"px\"] * random.uniform(0.985, 1.015), 2)\n            trades.append({\n                \"n\": cfg[\"order_offset\"] * 3 + t, \"order_n\": o[\"n\"],\n                \"client_n\": o[\"client_n\"], \"symbol\": o[\"symbol\"],\n                \"side\": o[\"side\"], \"qty\": qty, \"px\": px,\n                \"tdate\": o[\"date\"] + timedelta(days=random.randint(0, 2)),\n                \"sdate\": o[\"date\"] + timedelta(days=random.randint(2, 4)),\n                \"settle\": random.choices(SETTLE, [0.85, 0.1, 0.05])[0],\n                \"cpty\": random.choice(cfg[\"brokers\"]),\n                \"fee\": round(qty * px * 0.0005, 2),\n            })\n\n    contracts = []\n    for i in range(1, cfg[\"n_contracts\"] + 1):\n        n = cfg[\"contract_offset\"] + i\n        cl = random.choice(clients)\n        start = rand_date(date(2019, 1, 1), date(2025, 12, 31))\n        contracts.append({\n            \"n\": n, \"client_n\": cl[\"n\"],\n            \"ctype\": random.choice(CONTRACT_TYPES),\n            \"cstat\": random.choices(CONTRACT_STATUS, [0.6, 0.18, 0.12, 0.1])[0],\n            \"start\": start,\n            \"end\": start + timedelta(days=random.choice([365, 730, 1095, 1825])),\n            \"law\": random.choice(cfg[\"laws\"]),\n            \"cap\": round(random.uniform(1, 500), 1),\n            \"bps\": random.choice([5, 10, 15, 25, 50]),\n            \"renew\": random.choice([\"Yes\", \"No\"]),\n        })\n\n    # ---- project to the region's LOCAL schema ----------------------------\n    if region == \"amer\":\n        return {\n            \"clients\": pd.DataFrame([{\n                \"client_id\": f\"CL{c['n']:04d}\", \"client_name\": c[\"name\"],\n                \"segment\": c[\"segment\"], \"country\": c[\"country\"],\n                \"risk_rating\": c[\"risk\"], \"kyc_status\": c[\"kyc\"],\n                \"onboarding_date\": c[\"onboarded\"],\n                \"relationship_manager\": c[\"rm\"], \"aum_usd_mm\": c[\"aum\"],\n                \"email\": c[\"email\"]} for c in clients]),\n            \"orders\": pd.DataFrame([{\n                \"order_id\": f\"ORD{o['n']:05d}\", \"client_id\": f\"CL{o['client_n']:04d}\",\n                \"instrument_symbol\": o[\"symbol\"], \"instrument_name\": o[\"iname\"],\n                \"asset_class\": o[\"acls\"], \"side\": o[\"side\"],\n                \"order_type\": o[\"otype\"], \"quantity\": o[\"qty\"],\n                \"limit_price\": o[\"px\"], \"order_status\": o[\"status\"],\n                \"order_date\": o[\"date\"], \"venue\": o[\"venue\"]} for o in orders]),\n            \"trades\": pd.DataFrame([{\n                \"trade_id\": f\"TRD{t['n']:05d}\", \"order_id\": f\"ORD{t['order_n']:05d}\",\n                \"client_id\": f\"CL{t['client_n']:04d}\",\n                \"instrument_symbol\": t[\"symbol\"], \"side\": t[\"side\"],\n                \"executed_quantity\": t[\"qty\"], \"execution_price\": t[\"px\"],\n                \"trade_date\": t[\"tdate\"], \"settlement_date\": t[\"sdate\"],\n                \"settlement_status\": t[\"settle\"], \"counterparty\": t[\"cpty\"],\n                \"commission_usd\": t[\"fee\"]} for t in trades]),\n            \"contracts\": pd.DataFrame([{\n                \"contract_id\": f\"CON{c['n']:04d}\", \"client_id\": f\"CL{c['client_n']:04d}\",\n                \"contract_type\": c[\"ctype\"], \"contract_status\": c[\"cstat\"],\n                \"effective_date\": c[\"start\"], \"expiry_date\": c[\"end\"],\n                \"governing_law\": c[\"law\"], \"notional_cap_usd_mm\": c[\"cap\"],\n                \"fee_bps\": c[\"bps\"], \"auto_renewal\": c[\"renew\"]} for c in contracts]),\n        }\n\n    if region == \"emea\":\n        return {\n            \"clients\": pd.DataFrame([{\n                \"client_ref\": f\"EU-{c['n']:04d}\", \"legal_name\": c[\"name\"],\n                \"segment_code\": SEG_CODE[c[\"segment\"]], \"country_iso\": c[\"country\"],\n                \"risk_class\": RISK_CLASS[c[\"risk\"]], \"kyc_state\": KYC_EMEA[c[\"kyc\"]],\n                \"onboarded_on\": c[\"onboarded\"], \"coverage_banker\": c[\"rm\"],\n                \"aum_eur_mm\": round(c[\"aum\"] / 1.09, 2),\n                \"contact_email\": c[\"email\"],\n                \"mifid_category\": c[\"mifid\"]} for c in clients]),\n            \"orders\": pd.DataFrame([{\n                \"order_ref\": f\"EU-ORD-{o['n']:05d}\", \"client_ref\": f\"EU-{o['client_n']:04d}\",\n                \"instrument_code\": o[\"symbol\"], \"instrument_desc\": o[\"iname\"],\n                \"asset_category\": o[\"acls\"],\n                \"direction\": \"B\" if o[\"side\"] == \"Buy\" else \"S\",\n                \"order_kind\": OTYPE_EMEA[o[\"otype\"]], \"qty\": o[\"qty\"],\n                \"limit_px_eur\": round(o[\"px\"] / 1.09, 2),\n                \"status_code\": STATUS_EMEA[o[\"status\"]],\n                \"placed_on\": o[\"date\"], \"exchange\": o[\"venue\"]} for o in orders]),\n            \"trades\": pd.DataFrame([{\n                \"exec_ref\": f\"EU-TRD-{t['n']:05d}\", \"order_ref\": f\"EU-ORD-{t['order_n']:05d}\",\n                \"client_ref\": f\"EU-{t['client_n']:04d}\",\n                \"instrument_code\": t[\"symbol\"],\n                \"direction\": \"B\" if t[\"side\"] == \"Buy\" else \"S\",\n                \"exec_qty\": t[\"qty\"], \"exec_px_eur\": round(t[\"px\"] / 1.09, 2),\n                \"exec_date\": t[\"tdate\"], \"value_date\": t[\"sdate\"],\n                \"settle_state\": SETTLE_EMEA[t[\"settle\"]], \"broker\": t[\"cpty\"],\n                \"fee_eur\": round(t[\"fee\"] / 1.09, 2)} for t in trades]),\n            \"contracts\": pd.DataFrame([{\n                \"agreement_ref\": f\"EU-CON-{c['n']:04d}\", \"client_ref\": f\"EU-{c['client_n']:04d}\",\n                \"agreement_kind\": CTYPE_CODE[c[\"ctype\"]],\n                \"state_code\": CSTAT_EMEA[c[\"cstat\"]],\n                \"start_date\": c[\"start\"], \"end_date\": c[\"end\"],\n                \"law_code\": c[\"law\"],\n                \"cap_eur_mm\": round(c[\"cap\"] / 1.09, 1),\n                \"fee_basis_points\": c[\"bps\"],\n                \"evergreen_flag\": \"Y\" if c[\"renew\"] == \"Yes\" else \"N\"} for c in contracts]),\n        }\n\n    # apac\n    return {\n        \"clients\": pd.DataFrame([{\n            \"acct_no\": f\"AP-{c['n']:04d}\", \"acct_holder\": c[\"name\"],\n            \"client_tier\": SEG_TIER[c[\"segment\"]], \"domicile\": c[\"country\"],\n            \"risk_grade\": RISK_GRADE[c[\"risk\"]], \"kyc_flag\": KYC_APAC[c[\"kyc\"]],\n            \"opened_dt\": c[\"onboarded\"], \"rm_name\": c[\"rm\"],\n            \"aum_sgd_mm\": round(c[\"aum\"] / 0.74, 2),\n            \"email_addr\": c[\"email\"]} for c in clients]),\n        \"orders\": pd.DataFrame([{\n            \"ord_no\": f\"AP-ORD-{o['n']:05d}\", \"acct_no\": f\"AP-{o['client_n']:04d}\",\n            \"ticker\": o[\"symbol\"], \"security_name\": o[\"iname\"],\n            \"product_group\": o[\"acls\"],\n            \"bs_flag\": \"B\" if o[\"side\"] == \"Buy\" else \"S\",\n            \"ord_type_cd\": OTYPE_APAC[o[\"otype\"]], \"units\": o[\"qty\"],\n            \"px_sgd\": round(o[\"px\"] / 0.74, 2),\n            \"ord_state\": STATUS_APAC[o[\"status\"]],\n            \"ord_dt\": o[\"date\"], \"market\": o[\"venue\"]} for o in orders]),\n        \"trades\": pd.DataFrame([{\n            \"fill_no\": f\"AP-TRD-{t['n']:05d}\", \"ord_no\": f\"AP-ORD-{t['order_n']:05d}\",\n            \"acct_no\": f\"AP-{t['client_n']:04d}\", \"ticker\": t[\"symbol\"],\n            \"bs_flag\": \"B\" if t[\"side\"] == \"Buy\" else \"S\",\n            \"fill_qty\": t[\"qty\"], \"fill_px_sgd\": round(t[\"px\"] / 0.74, 2),\n            \"fill_dt\": t[\"tdate\"], \"settle_dt\": t[\"sdate\"],\n            \"settle_flag\": SETTLE_APAC[t[\"settle\"]], \"cpty\": t[\"cpty\"],\n            \"comm_sgd\": round(t[\"fee\"] / 0.74, 2)} for t in trades]),\n        \"contracts\": pd.DataFrame([{\n            \"agmt_no\": f\"AP-CON-{c['n']:04d}\", \"acct_no\": f\"AP-{c['client_n']:04d}\",\n            \"agmt_type_cd\": CTYPE_CODE[c[\"ctype\"]],\n            \"agmt_status_cd\": CSTAT_APAC[c[\"cstat\"]],\n            \"eff_dt\": c[\"start\"], \"exp_dt\": c[\"end\"],\n            \"gov_law\": c[\"law\"], \"cap_sgd_mm\": round(c[\"cap\"] / 0.74, 1),\n            \"fee_bps\": c[\"bps\"],\n            \"auto_renew\": \"Y\" if c[\"renew\"] == \"Yes\" else \"N\"} for c in contracts]),\n    }\n\n\nif __name__ == \"__main__\":\n    for region, cfg in REGIONS.items():\n        folder = os.path.join(OUT, region)\n        os.makedirs(folder, exist_ok=True)\n        frames = make_region(region, cfg)\n        for name, df in frames.items():\n            path = os.path.join(folder, f\"{name}.xlsx\")\n            df.to_excel(path, index=False, sheet_name=name)\n            print(f\"{region}/{name}: {len(df)} rows, cols={list(df.columns)[:4]}... -> {path}\")\n"}, {"name": "shacl_validate.py", "lines": 142, "content": "\"\"\"SHACL validation of the FEDERATED data products.\n\nValidation runs on the CANONICAL view: each region's source file is first\ncanonicalised by the federation layer (mappings + transformation rules), then\nevery canonical row is lifted to RDF (typed with the global ontology class,\ncolumns as d:<column> predicates with XSD datatypes) and validated against\nshacl/data_product_shapes.ttl with pySHACL.\n\nThis proves an important property of the federation: three regional systems\nwith incompatible local schemas all satisfy ONE global data contract after\nthe ontology-driven transformations are applied.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nfrom datetime import date, datetime\nfrom decimal import Decimal\n\nimport pandas as pd\nimport rdflib\nfrom pyshacl import validate\nfrom rdflib import Literal, Namespace, RDF, URIRef\nfrom rdflib.namespace import XSD\n\nBASE = os.path.dirname(os.path.abspath(__file__))\nSHAPES_FILE = os.path.join(BASE, \"shacl\", \"data_product_shapes.ttl\")\n\nD = Namespace(\"http://example.org/finserv/data#\")\nGB = \"http://example.org/finserv/global#\"\nCLASS_URIS = {\n    \"clients\": URIRef(GB + \"Client\"),\n    \"orders\": URIRef(GB + \"Order\"),\n    \"trades\": URIRef(GB + \"Trade\"),\n    \"contracts\": URIRef(GB + \"Contract\"),\n}\nID_COLUMNS = {\"clients\": \"client_id\", \"orders\": \"order_id\", \"trades\": \"trade_id\",\n              \"contracts\": \"contract_id\"}\nDATE_COLUMNS = {\"onboarding_date\", \"order_date\", \"trade_date\", \"settlement_date\",\n                \"effective_date\", \"expiry_date\"}\nINT_COLUMNS = {\"quantity\", \"executed_quantity\", \"fee_bps\"}\n\n_STORE = None\n\n\ndef _store():\n    global _STORE\n    if _STORE is None:\n        from data_product import FederatedStore\n        _STORE = FederatedStore()\n    return _STORE\n\n\ndef to_literal(col: str, value) -> Literal | None:\n    if pd.isna(value):\n        return None\n    if col in DATE_COLUMNS:\n        if isinstance(value, (datetime, pd.Timestamp)):\n            return Literal(value.date(), datatype=XSD.date)\n        if isinstance(value, date):\n            return Literal(value, datatype=XSD.date)\n        return Literal(str(value)[:10], datatype=XSD.date)\n    if col in INT_COLUMNS:\n        return Literal(int(value), datatype=XSD.integer)\n    if isinstance(value, bool):\n        return Literal(value)\n    if isinstance(value, (int, float, Decimal)):\n        return Literal(Decimal(str(value)), datatype=XSD.decimal)\n    # plain literal (implicitly xsd:string in RDF 1.1) so sh:in string lists match\n    return Literal(str(value))\n\n\ndef lift_dataset(dataset: str, df: pd.DataFrame | None = None) -> rdflib.Graph:\n    \"\"\"Convert one CANONICAL data product view (or a provided frame) to RDF.\"\"\"\n    if df is None:\n        df, _ = _store().combined_frame(dataset)\n    g = rdflib.Graph()\n    g.bind(\"d\", D)\n    cls = CLASS_URIS[dataset]\n    id_col = ID_COLUMNS[dataset]\n    for i, row in df.iterrows():\n        node = URIRef(f\"http://example.org/finserv/data/{dataset}/{row.get(id_col, i)}\")\n        g.add((node, RDF.type, cls))\n        for col, val in row.items():\n            lit = to_literal(col, val)\n            if lit is not None:\n                g.add((node, D[col], lit))\n    return g\n\n\ndef validate_dataset(dataset: str, df: pd.DataFrame | None = None,\n                     regions: list[str] | None = None) -> dict:\n    \"\"\"Run SHACL validation on the canonical view; optionally one region only.\"\"\"\n    if dataset not in CLASS_URIS:\n        return {\"dataset\": dataset,\n                \"error\": f\"No SHACL shape defined for '{dataset}'. Shapes exist for {list(CLASS_URIS)}.\"}\n    if df is None:\n        df, _ = _store().combined_frame(dataset, regions)\n    data_graph = lift_dataset(dataset, df)\n    conforms, results_graph, _ = validate(\n        data_graph, shacl_graph=SHAPES_FILE, inference=\"none\", abort_on_first=False)\n    violations = []\n    SH = Namespace(\"http://www.w3.org/ns/shacl#\")\n    for r in results_graph.subjects(RDF.type, SH.ValidationResult):\n        violations.append({\n            \"focus_row\": str(results_graph.value(r, SH.focusNode) or \"\").split(\"/\")[-1],\n            \"column\": str(results_graph.value(r, SH.resultPath) or \"\").split(\"#\")[-1],\n            \"value\": str(results_graph.value(r, SH.value) or \"\"),\n            \"message\": str(results_graph.value(r, SH.resultMessage) or \"\"),\n            \"severity\": str(results_graph.value(r, SH.resultSeverity) or \"\").split(\"#\")[-1],\n        })\n    return {\"dataset\": dataset,\n            \"regions\": regions or \"all\",\n            \"rows_validated\": len(set(data_graph.subjects(RDF.type, None))),\n            \"conforms\": bool(conforms), \"violation_count\": len(violations),\n            \"violations\": violations[:25]}\n\n\nif __name__ == \"__main__\":\n    import json\n\n    print(\"Validating the CANONICAL view (all regions federated):\")\n    for ds in (\"clients\", \"orders\", \"trades\", \"contracts\"):\n        rep = validate_dataset(ds)\n        print(f\"  {ds}: rows={rep['rows_validated']} conforms={rep['conforms']} \"\n              f\"violations={rep['violation_count']}\")\n\n    # Demo: inject bad rows to prove the shapes catch real data-quality issues\n    print(\"\\n--- Injecting 2 corrupt client rows (bad segment, negative AUM, bad email) ---\")\n    df, _ = _store().combined_frame(\"clients\")\n    bad = pd.DataFrame([\n        {\"client_id\": \"CL9998\", \"client_name\": \"Bad Segment Ltd\", \"segment\": \"VIP\",\n         \"country\": \"UK\", \"risk_rating\": \"High\", \"kyc_status\": \"Verified\",\n         \"onboarding_date\": \"2024-01-01\", \"relationship_manager\": \"X Y\",\n         \"aum_usd_mm\": 10.0, \"email\": \"ok@example.com\", \"region\": \"EMEA\"},\n        {\"client_id\": \"CL9999\", \"client_name\": \"Negative Aum Inc\", \"segment\": \"Retail\",\n         \"country\": \"USA\", \"risk_rating\": \"Extreme\", \"kyc_status\": \"Verified\",\n         \"onboarding_date\": \"2024-01-01\", \"relationship_manager\": \"X Y\",\n         \"aum_usd_mm\": -5.0, \"email\": \"not-an-email\", \"region\": \"AMER\"},\n    ])\n    rep = validate_dataset(\"clients\", pd.concat([df, bad], ignore_index=True))\n    print(json.dumps(rep, indent=1))\n"}, {"name": "knowledge_graph.py", "lines": 189, "content": "\"\"\"Knowledge graph over the FEDERATED canonical view.\n\nUnifies in one queryable RDF graph:\n  1. TBox  \u2014 the entire ontology repository (global ontology, regional\n             extensions, physical mappings, rules, taxonomies)\n  2. ABox  \u2014 every regional row, canonicalised by the federation layer and\n             lifted to RDF (typed with the global ontology classes, carrying\n             a d:region provenance attribute)\n  3. Edges \u2014 materialized object properties (gb:placesOrder, gb:executionOf,\n             gb:hasContract, gb:executesTrade) and fs:classifiedAs links from\n             instances to taxonomy concepts\n\nBecause instances are canonical, a single SPARQL query traverses data that\nphysically lives in three differently-shaped regional systems.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\n\nimport rdflib\nfrom rdflib import Literal, Namespace, RDF, URIRef\nfrom rdflib.namespace import SKOS\n\nfrom federation import FS, FederatedOntology\nfrom shacl_validate import lift_dataset, D\n\nBASE = os.path.dirname(os.path.abspath(__file__))\nKG_FILE = os.path.join(BASE, \"knowledge_graph.ttl\")\n\nGB = Namespace(\"http://example.org/finserv/global#\")\nTAX = Namespace(\"http://example.org/finserv/taxonomy#\")\n\n\ndef _node(dataset: str, row_id: str) -> URIRef:\n    return URIRef(f\"http://example.org/finserv/data/{dataset}/{row_id}\")\n\n\ndef build_knowledge_graph(save: bool = False,\n                          federation: FederatedOntology | None = None,\n                          store=None) -> rdflib.Graph:\n    from data_product import FederatedStore\n    fed = federation or FederatedOntology()\n    store = store or FederatedStore(fed)\n\n    g = rdflib.Graph()\n    for prefix, ns in [(\"gb\", GB), (\"tax\", TAX), (\"d\", D), (\"fs\", FS),\n                       (\"skos\", SKOS)]:\n        g.bind(prefix, ns)\n\n    # 1: schema \u2014 the whole ontology repository (all federated layers)\n    g += fed.graph\n\n    # 2: instances \u2014 canonical view of all datasets across all regions\n    frames = {}\n    for ds in (\"clients\", \"orders\", \"trades\", \"contracts\"):\n        frames[ds], _ = store.combined_frame(ds)\n        g += lift_dataset(ds, frames[ds])\n\n    # 3a: relationship edges from canonical foreign keys\n    for _, o in frames[\"orders\"].iterrows():\n        order, client = _node(\"orders\", o[\"order_id\"]), _node(\"clients\", o[\"client_id\"])\n        g.add((client, GB.placesOrder, order))\n    for _, t in frames[\"trades\"].iterrows():\n        trade = _node(\"trades\", t[\"trade_id\"])\n        g.add((trade, GB.executionOf, _node(\"orders\", t[\"order_id\"])))\n        g.add((_node(\"clients\", t[\"client_id\"]), GB.executesTrade, trade))\n    for _, c in frames[\"contracts\"].iterrows():\n        contract, client = _node(\"contracts\", c[\"contract_id\"]), _node(\"clients\", c[\"client_id\"])\n        g.add((client, GB.hasContract, contract))\n\n    # 3b: classifiedAs edges -> taxonomy concepts (via fs:mappedToValue)\n    concept_index: dict[tuple[str, str, str], URIRef] = {}\n    for concept in g.subjects(RDF.type, SKOS.Concept):\n        ds = g.value(concept, FS.mappedToDataset)\n        col = g.value(concept, FS.mappedToColumn)\n        val = g.value(concept, FS.mappedToValue)\n        if ds and col and val:\n            concept_index[(str(ds), str(col), str(val))] = concept\n    for ds, id_col in ((\"clients\", \"client_id\"), (\"orders\", \"order_id\"),\n                       (\"trades\", \"trade_id\")):\n        for _, row in frames[ds].iterrows():\n            for col, val in row.items():\n                concept = concept_index.get((ds, col, str(val)))\n                if concept is not None:\n                    g.add((_node(ds, row[id_col]), FS.classifiedAs, concept))\n\n    if save:\n        g.serialize(KG_FILE, format=\"turtle\")\n    return g\n\n\n# --------------------------------------------------------------- exploration\n_ID_PREFIX = {\"CL\": \"clients\", \"ORD\": \"orders\", \"TRD\": \"trades\", \"CON\": \"contracts\"}\n\n\ndef find_entity(g: rdflib.Graph, identifier: str) -> URIRef | None:\n    \"\"\"Find a node by canonical row id (CL0103, ORD00242, ...) or client name.\"\"\"\n    ident = identifier.strip()\n    for prefix, ds in sorted(_ID_PREFIX.items(), key=lambda x: -len(x[0])):\n        if ident.upper().startswith(prefix) and ident[len(prefix):].isdigit():\n            return _node(ds, ident.upper())\n    for s, _, o in g.triples((None, D[\"client_name\"], None)):\n        if ident.lower() in str(o).lower():\n            return s\n    return None\n\n\ndef entity_360(g: rdflib.Graph, identifier: str, max_links: int = 15) -> dict:\n    \"\"\"All attributes + inbound/outbound relationships of an entity.\"\"\"\n    node = find_entity(g, identifier)\n    if node is None:\n        return {\"error\": f\"No entity found for '{identifier}'. \"\n                         \"Use canonical ids like CL0103 / ORD00242 / TRD00307 / \"\n                         \"CON0211 (regional refs are normalised), or a client name.\"}\n\n    def short(u) -> str:\n        s = str(u)\n        return s.rsplit(\"/\", 1)[-1] if \"/data/\" in s else s.split(\"#\")[-1]\n\n    attrs, out_links, in_links = {}, [], []\n    for p, o in g.predicate_objects(node):\n        if isinstance(o, Literal):\n            attrs[short(p)] = str(o)\n        elif p != RDF.type:\n            out_links.append({\"relation\": short(p), \"target\": short(o)})\n    for s, p in g.subject_predicates(node):\n        in_links.append({\"relation\": short(p), \"source\": short(s)})\n    types = [short(t) for t in g.objects(node, RDF.type)]\n    return {\"entity\": short(node), \"types\": types, \"attributes\": attrs,\n            \"outgoing\": out_links[:max_links], \"outgoing_total\": len(out_links),\n            \"incoming\": in_links[:max_links], \"incoming_total\": len(in_links)}\n\n\ndef run_sparql(g: rdflib.Graph, query: str, limit: int = 50) -> list[dict]:\n    \"\"\"Execute a read-only SPARQL SELECT/ASK query, return rows as dicts.\"\"\"\n    res = g.query(query)\n    if res.type == \"ASK\":\n        return [{\"ask\": bool(res.askAnswer)}]\n    rows = []\n    for binding in res:\n        row = {}\n        for var, val in zip(res.vars, binding):\n            if val is None:\n                continue\n            s = str(val)\n            row[str(var)] = s.rsplit(\"/\", 1)[-1] if \"/data/\" in s else (\n                s.split(\"#\")[-1] if s.startswith(\"http\") else s)\n        rows.append(row)\n        if len(rows) >= limit:\n            break\n    return rows\n\n\nif __name__ == \"__main__\":\n    import json\n\n    g = build_knowledge_graph(save=True)\n    n_nodes = len(set(g.subjects()) | {o for o in g.objects() if isinstance(o, URIRef)})\n    print(f\"Knowledge graph: {len(g)} triples, ~{n_nodes} nodes -> {KG_FILE}\")\n\n    print(\"\\n--- entity 360: CL0103 (an EMEA client, canonicalised from EU-0103) ---\")\n    print(json.dumps(entity_360(g, \"CL0103\"), indent=1)[:1200])\n\n    print(\"\\n--- SPARQL: clients by failed-settlement trades ACROSS ALL REGIONS ---\")\n    q = \"\"\"\n    PREFIX d: <http://example.org/finserv/data#>\n    PREFIX gb: <http://example.org/finserv/global#>\n    SELECT ?name ?region (COUNT(?t) AS ?failed) WHERE {\n        ?t d:settlement_status \"Failed\" .\n        ?c gb:executesTrade ?t ; d:client_name ?name ; d:region ?region .\n    } GROUP BY ?name ?region ORDER BY DESC(?failed) LIMIT 5\n    \"\"\"\n    print(json.dumps(run_sparql(g, q), indent=1))\n\n    print(\"\\n--- SPARQL: fixed-income orders via taxonomy branch (skos:broader*) ---\")\n    q2 = \"\"\"\n    PREFIX fs: <http://example.org/finserv#>\n    PREFIX tax: <http://example.org/finserv/taxonomy#>\n    PREFIX skos: <http://www.w3.org/2004/02/skos/core#>\n    PREFIX d: <http://example.org/finserv/data#>\n    SELECT DISTINCT ?order ?symbol ?region ?notional WHERE {\n        ?concept skos:broader* tax:FixedIncomeInstrument .\n        ?order fs:classifiedAs ?concept ;\n               d:instrument_symbol ?symbol ; d:region ?region ;\n               d:notional_usd ?notional .\n    } ORDER BY DESC(?notional) LIMIT 5\n    \"\"\"\n    print(json.dumps(run_sparql(g, q2), indent=1))\n"}];

// ---------------------------------------------------------------- utilities
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fatal(msg) {
  const box = document.getElementById('fatal');
  box.style.display = 'block';
  box.textContent += (box.textContent ? '\n' : '') + msg;
}

// ---------------------------------------------------------------- tiny markdown renderer
// Deliberately minimal (headers, bold/italic, inline code, fenced code
// blocks, lists, tables, links, blockquotes, hr, paragraphs) — no external
// dependency, so it can never fail to load.
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function markdownToHtml(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let out = '', i = 0, inList = null, tableBuf = [];
  function closeList() { if (inList) { out += '</' + inList + '>'; inList = null; } }
  function flushTable() {
    if (!tableBuf.length) return;
    const rows = tableBuf.filter((r, idx) => idx !== 1);
    out += '<table>';
    rows.forEach((r, idx) => {
      const cells = r.split('|').map(c => c.trim());
      if (cells.length && cells[0] === '') cells.shift();
      if (cells.length && cells[cells.length - 1] === '') cells.pop();
      const tag = idx === 0 ? 'th' : 'td';
      out += '<tr>' + cells.map(c => '<' + tag + '>' + inlineMd(c) + '</' + tag + '>').join('') + '</tr>';
    });
    out += '</table>';
    tableBuf = [];
  }
  const sepRe = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      closeList(); flushTable();
      const code = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out += '<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>';
      continue;
    }
    if (/^\|.*\|\s*$/.test(line) && lines[i + 1] && sepRe.test(lines[i + 1])) {
      closeList();
      tableBuf.push(line);
      i++;
      continue;
    }
    if (tableBuf.length) flushTable();
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList();
      out += '<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>';
      i++; continue;
    }
    if (/^\s*---+\s*$/.test(line) && line.trim() !== '') {
      closeList();
      out += '<hr>';
      i++; continue;
    }
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) {
      closeList();
      out += '<blockquote>' + inlineMd(bq[1]) + '</blockquote>';
      i++; continue;
    }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      if (inList !== 'ul') { closeList(); out += '<ul>'; inList = 'ul'; }
      out += '<li>' + inlineMd(ul[1]) + '</li>';
      i++; continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); out += '<ol>'; inList = 'ol'; }
      out += '<li>' + inlineMd(ol[1]) + '</li>';
      i++; continue;
    }
    if (line.trim() === '') { closeList(); i++; continue; }
    closeList();
    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== ''
           && !/^#{1,6}\s/.test(lines[i]) && !/^```/.test(lines[i])
           && !/^\s*[-*]\s/.test(lines[i]) && !/^\s*\d+\.\s/.test(lines[i])
           && !/^>/.test(lines[i]) && !/^\s*---+\s*$/.test(lines[i])
           && !(lines[i].includes('|') && lines[i + 1] && sepRe.test(lines[i + 1]))) {
      para.push(lines[i]); i++;
    }
    out += '<p>' + inlineMd(para.join(' ')) + '</p>';
  }
  closeList(); flushTable();
  return out;
}

// ---------------------------------------------------------------- tiny python highlighter
// Single-pass tokenizer: walk regex matches left to right, HTML-escaping the
// untouched text between matches and wrapping each match in its token span.
// (A previous stash/restore approach had a bug where the number-highlighting
// pass corrupted its own placeholder markers before they were restored.)
const PY_TOKEN_RE = /("""[\s\S]*?"""|'''[\s\S]*?'''|#[^\n]*|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|@[A-Za-z_][\w.]*|\b(?:def|class|import|from|return|if|elif|else|for|while|in|not|and|or|is|try|except|finally|raise|with|as|pass|break|continue|lambda|yield|global|nonlocal|None|True|False|self|async|await|del|assert)\b|\b\d+\.?\d*\b)/g;

function highlightPython(raw) {
  let out = '', last = 0, m;
  PY_TOKEN_RE.lastIndex = 0;
  while ((m = PY_TOKEN_RE.exec(raw)) !== null) {
    out += escapeHtml(raw.slice(last, m.index));
    const tok = m[0];
    let cls;
    if (tok.startsWith('"""') || tok.startsWith("'''") || tok[0] === "'" || tok[0] === '"') cls = 'tok-str';
    else if (tok[0] === '#') cls = 'tok-com';
    else if (tok[0] === '@') cls = 'tok-dec';
    else if (/^\d/.test(tok)) cls = 'tok-num';
    else cls = 'tok-kw';
    out += '<span class="' + cls + '">' + escapeHtml(tok) + '</span>';
    last = PY_TOKEN_RE.lastIndex;
    if (m.index === PY_TOKEN_RE.lastIndex) PY_TOKEN_RE.lastIndex++;  // avoid infinite loop on zero-width match
  }
  out += escapeHtml(raw.slice(last));
  return out;
}

// ---------------------------------------------------------------- build UI
// Nav is built FIRST and defensively (each item independent), so a failure
// rendering one file's content can never blank out the whole sidebar.
const nav = document.getElementById('nav');
const main = document.getElementById('main');

function navItem(id, label, meta, active) {
  const btn = document.createElement('button');
  btn.className = 'navitem' + (active ? ' active' : '');
  btn.dataset.target = id;
  btn.innerHTML = '<span>' + escapeHtml(label) + '</span>' +
    (meta ? '<span class="meta">' + escapeHtml(meta) + '</span>' : '');
  btn.onclick = () => show(id);
  nav.appendChild(btn);
  return btn;
}

const readmeLabel = document.createElement('div');
readmeLabel.className = 'group-label';
readmeLabel.textContent = 'Documentation';
nav.appendChild(readmeLabel);
navItem('readme', 'README.md', '', true);

const pyLabel = document.createElement('div');
pyLabel.className = 'group-label';
pyLabel.textContent = 'Python modules (' + FILES.length + ')';
nav.appendChild(pyLabel);
FILES.forEach(f => navItem('file-' + f.name, f.name, f.lines + ' ln'));

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.navitem').forEach(b => b.classList.remove('active'));
  const view = document.getElementById('view-' + id);
  const btn = document.querySelector('.navitem[data-target="' + id + '"]');
  if (view) view.classList.add('active');
  if (btn) btn.classList.add('active');
  main.scrollTop = 0;
}

function addView(id, buildHtml) {
  const view = document.createElement('div');
  view.className = 'view' + (id === 'readme' ? ' active' : '');
  view.id = 'view-' + id;
  try {
    view.innerHTML = buildHtml();
  } catch (e) {
    view.innerHTML = '<p style="color:#ff6b6b">Failed to render this view: ' + escapeHtml(String(e)) + '</p>';
  }
  main.appendChild(view);
}

addView('readme', () => '<div id="readme">' + markdownToHtml(README) + '</div>');
FILES.forEach(f => {
  addView('file-' + f.name, () =>
    '<div class="filehead"><h2>' + escapeHtml(f.name) + '</h2>' +
    '<span class="linecount">' + f.lines + ' lines</span></div>' +
    '<pre class="code-block"><code>' + highlightPython(f.content) + '</code></pre>');
});
</script>
